<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f9f8fb;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <span
      style="
        display: none;
        font-size: 1px;
        color: #f9f8fb;
        line-height: 1px;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
      "
      >Your Selftend verification code.</span
    >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f9f8fb; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              width: 480px;
              max-width: 480px;
              background-color: #ffffff;
              border: 1px solid #dad8e2;
              border-radius: 10px;
            "
          >
            <tr>
              <td style="padding: 40px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 600;
                    color: #221d2a;
                  "
                >
                  Verify your email
                </p>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 22px; color: #67636f">
                  Enter this code in the Selftend app to verify your email address.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 32px;
                    line-height: 40px;
                    font-weight: 700;
                    letter-spacing: 6px;
                    color: #221d2a;
                  "
                >
                  {{ .Token }}
                </p>

                <p style="margin: 24px 0 0; font-size: 13px; line-height: 19px; color: #9d99a8">
                  The code and link work once and expire about an hour after they were sent. If you
                  didn&rsquo;t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
