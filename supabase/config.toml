[functions.send-web-reminders]
verify_jwt = false

# Optional: Google OAuth against the local stack. Uncomment + export
# GOOGLE_LOCAL_CLIENT_ID and GOOGLE_LOCAL_CLIENT_SECRET before `supabase start`.
# See supabase/README.md "Local development" for the dev OAuth client setup.
# Left commented out by default so unset env vars don't print warnings on every
# CLI invocation.
[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth-callback", "http://localhost:8099/auth-callback", "selftend://**", "selftend-dev://**"]
# Password policy - NIST SP 800-63B modern: longer minimum, no character-class
# rules. HIBP leaked-password check is enabled separately via the Supabase
# Dashboard (see docs/operations-runbook.md "Auth Security Toggles") because
# it is not yet representable in config.toml at time of writing.
minimum_password_length = 12

# Optional registration (#1440): a native first launch silently creates a guest
# account via anonymous sign-in, so the local stack and e2e need the provider
# on. Hosted projects gate it with the Dashboard toggle instead - the client
# ships dark, and that toggle is the permanent kill switch. Manual linking is
# what the OAuth conversion path (linkIdentity) requires.
enable_anonymous_sign_ins = true
enable_manual_linking = true

# Kept at the Supabase default on purpose (#1432 ruling) - recorded here so the
# 30 guest-creations/hour/IP cap is version-controlled, not implicit.
[auth.rate_limit]
anonymous_users = 30

# Autoconfirm (#489): signups get a session immediately and the app runs its
# own verification layer - user_preferences.email_verified plus the in-app
# banner that sends a signInWithOtp code. Mirrors mailer_autoconfirm=true on
# the hosted projects; flipping prod is an explicit release step.
[auth.email]
enable_confirmations = false
# Pinned because the client used to hardcode 6 while the hosted project issued
# 8-digit codes, which truncated every code and broke verification silently.
# Version-controlling it keeps local and hosted honest; the client tolerates a
# range so changing this cannot break sign-in again.
otp_length = 6

# Email templates use `{{ .SiteURL }}/auth-callback?token_hash={{ .TokenHash }}&type=...`
# links instead of the default `{{ .ConfirmationURL }}`. The default runs through GoTrue's
# /auth/v1/verify, which under the PKCE flow 303s back with a `?code=` that can only
# be exchanged by the browser profile that initiated the request (the PKCE
# code_verifier lives in that profile's storage) - opening the email on any other
# browser/device fails with "PKCE code verifier not found in storage". token_hash
# links skip /verify entirely; the app callback completes them via verifyOtp, which
# needs no local verifier state, so they work in any browser. `{{ .SiteURL }}` (not
# `{{ .RedirectTo }}`) is the link base on purpose: native clients send the app scheme
# (`selftend://auth-callback`) as redirect_to, and Go's html/template rejects custom
# schemes in an href - the link renders as the literal dead string `ZgotmplZ?...`.
# site_url is always http(s), so the link survives every client. site_url must have
# NO trailing slash or links become `//auth-callback`. The e2e suite rewrites the
# link origin to its own port, so pinning to site_url doesn't break it.
# Production must mirror these bodies in the Dashboard - see
# docs/operations-runbook.md "Auth Email Templates".
[auth.email.template.confirmation]
subject = "Confirm your email for Selftend"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Selftend password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Selftend"
content_path = "./supabase/templates/email_change.html"

# Sent by signInWithOtp - the verify-email banner's "send code" (#489). The
# code is the primary path; the link is the fallback for mail clients where
# copying is awkward. `type=email` (not the deprecated `magiclink`) because
# that is the spelling the app callback accepts.
[auth.email.template.magic_link]
subject = "Your Selftend verification code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to Selftend"
content_path = "./supabase/templates/invite.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_LOCAL_CLIENT_ID)"
secret = "env(GOOGLE_LOCAL_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
skip_nonce_check = true

# Sign in with Apple, required by App Store Guideline 4.8 (the app offers Google
# Sign-In, so it must also offer a login that keeps the user's email private).
#
# Disabled locally by default: the native flow needs a real Apple account and a
# signed iOS build, neither of which exists against a local stack, so enabling
# it would only produce confusing failures. Turn it on if you are working on the
# Apple path against your own Supabase project.
#
# `client_id` is the iOS BUNDLE identifier for the native flow (not the Services
# ID - that one is only for the web/OAuth flow). `secret` is unused by the
# native path: signInWithIdToken validates the identity token's audience against
# client_id and never performs an OAuth exchange.
[auth.external.apple]
enabled = false
client_id = "env(APPLE_LOCAL_CLIENT_ID)"
secret = "env(APPLE_LOCAL_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

# TOTP factor type enabled in config now so future MFA UI (Phase 2) can call
# the enroll/verify endpoints without another config push. No UI ships in P1.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
