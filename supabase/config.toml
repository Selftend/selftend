[functions.send-web-reminders]
verify_jwt = false

# Optional: Google OAuth against the local stack. Uncomment + export
# GOOGLE_LOCAL_CLIENT_ID and GOOGLE_LOCAL_CLIENT_SECRET before `supabase start`.
# See supabase/README.md "Local development" for the dev OAuth client setup.
# Left commented out by default so unset env vars don't print warnings on every
# CLI invocation.
[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth-callback", "http://localhost:8099/auth-callback", "selftend://**", "selftend-dev://**"]
# Password policy - NIST SP 800-63B modern: longer minimum, no character-class
# rules. HIBP leaked-password check is enabled separately via the Supabase
# Dashboard (see docs/operations-runbook.md "Auth Security Toggles") because
# it is not yet representable in config.toml at time of writing.
minimum_password_length = 12

[auth.email]
enable_confirmations = true

# Email templates use `{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=...` links
# instead of the default `{{ .ConfirmationURL }}`. The default runs through GoTrue's
# /auth/v1/verify, which under the PKCE flow 303s back with a `?code=` that can only
# be exchanged by the browser profile that initiated the request (the PKCE
# code_verifier lives in that profile's storage) - opening the email on any other
# browser/device fails with "PKCE code verifier not found in storage". token_hash
# links skip /verify entirely; the app callback completes them via verifyOtp, which
# needs no local verifier state, so they work in any browser. `{{ .RedirectTo }}` is
# the (allowlist-validated) redirect_to the client sent, falling back to site_url -
# so links land on the requesting origin (:8081 dev, :8099 e2e) without pinning.
# Production must mirror these bodies in the Dashboard - see
# docs/operations-runbook.md "Auth Email Templates".
[auth.email.template.confirmation]
subject = "Confirm your email for Selftend"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Selftend password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Selftend"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You're invited to Selftend"
content_path = "./supabase/templates/invite.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_LOCAL_CLIENT_ID)"
secret = "env(GOOGLE_LOCAL_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
skip_nonce_check = true

# TOTP factor type enabled in config now so future MFA UI (Phase 2) can call
# the enroll/verify endpoints without another config push. No UI ships in P1.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
