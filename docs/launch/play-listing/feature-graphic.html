<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
      }
      .banner {
        width: 1024px;
        height: 500px;
        display: flex;
        align-items: center;
        background:
          radial-gradient(770px 445px at 85% -10%, rgba(123, 76, 217, 0.18), transparent 60%),
          radial-gradient(575px 390px at -5% 110%, rgba(123, 76, 217, 0.14), transparent 55%),
          linear-gradient(135deg, #f6f3fb 0%, #efe9f8 55%, #e9e1f6 100%);
      }
      .left {
        width: 440px;
        padding: 0 0 0 60px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .brand img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(93, 57, 172, 0.25);
      }
      .brand .name {
        font-size: 46px;
        font-weight: 700;
        color: #241b33;
        letter-spacing: -0.7px;
      }
      h1 {
        font-size: 30px;
        font-weight: 700;
        color: #2c2140;
        line-height: 1.2;
        margin-bottom: 14px;
        letter-spacing: -0.3px;
      }
      h1 .accent {
        color: #7b4cd9;
      }
      .sub {
        font-size: 17px;
        color: #574a70;
        line-height: 1.45;
        margin-bottom: 20px;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .pill {
        font-size: 14px;
        font-weight: 600;
        color: #5d39ac;
        background: rgba(255, 255, 255, 0.85);
        border: 1.5px solid rgba(123, 76, 217, 0.35);
        border-radius: 999px;
        padding: 6px 14px;
      }
      .phones {
        position: relative;
        flex: 1;
        height: 100%;
      }
      .phone {
        position: absolute;
        border-radius: 22px;
        overflow: hidden;
        border: 7px solid #241b33;
        background: #241b33;
        box-shadow: 0 18px 38px rgba(40, 25, 75, 0.35);
      }
      .phone img {
        display: block;
        width: 100%;
      }
      .phone.p1 {
        width: 190px;
        left: 20px;
        top: 90px;
        transform: rotate(-5deg);
        z-index: 3;
      }
      .phone.p2 {
        width: 190px;
        left: 200px;
        top: 36px;
        z-index: 2;
      }
      .phone.p3 {
        width: 190px;
        left: 380px;
        top: 90px;
        transform: rotate(5deg);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="left">
        <div class="brand">
          <img src="../../../assets/icon.png" alt="" />
          <div class="name">Selftend</div>
        </div>
        <h1>Calm, guided <span class="accent">self-help</span></h1>
        <div class="sub">Free, open-source tools for working with thoughts, moods, and habits.</div>
        <div class="pills">
          <div class="pill">No ads</div>
          <div class="pill">Open source</div>
          <div class="pill">Private by design</div>
        </div>
      </div>
      <div class="phones">
        <div class="phone p1"><img src="../reddit-post/screen-cbt-home.png" /></div>
        <div class="phone p2"><img src="../reddit-post/screen-dashboard.png" /></div>
        <div class="phone p3"><img src="../reddit-post/screen-breathing.png" /></div>
      </div>
    </div>
  </body>
</html>
