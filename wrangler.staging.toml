# Cloudflare Workers static-assets deploy — STAGING → selftend-staging.vasil-yoshev.workers.dev
# (Netlify-exit spec §4c; the custom domain staging.selftend.org came off on
# 2026-09-23, #2319 — the Worker serves on its own workers.dev hostname now, and
# there is deliberately no [[routes]] block here, so nothing in the deploy path
# hardcodes a host). web-deploy.yml selects this config when called with
# environment=staging; the guard job in staging.yml asserts the name below is
# the staging Worker (never "selftend") before any deploy runs.
name = "selftend-staging"
compatibility_date = "2026-07-01"

[assets]
directory = "./dist"
# Same fallback mode as production (docs/indexability.md § 6.4, #2295): the
# index-list files answer 200, everything else a real 404 with dist/404.html.
not_found_handling = "404-page"
