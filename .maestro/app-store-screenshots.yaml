appId: org.vasilyoshev.selftend
env:
  # Three slashes on purpose: `Linking.createURL("/")` yields `selftend:///`, so
  # this is the exact prefix expo-router strips before routing. The two-slash
  # form parses the first segment as a hostname and is a coin flip.
  APP_LINK: "selftend:///"
---
# Drives the app far enough to photograph it for the App Store.
#
# `simctl` can boot, install, launch and screenshot, but it cannot type or tap -
# so automation alone reaches the sign-in screen and stops. A listing showing
# only a login form is a poor advertisement for an app whose entire value is
# behind it, hence Maestro.
#
# Signs in as the staged demo account (#514). Never a real person's account:
# these images are published on a public store listing, and the app holds
# private mental-health writing.
#
# TWO THINGS ARE DELIBERATE HERE, both from review on #549:
#
# 1. **Selectors are ids, not visible copy.** The first revision waited on the
#    text `Today`, but the home eyebrow renders `Today · {{date}}` and Maestro's
#    `text` matcher is a whole-string regex - it would never have matched, and
#    the run would have ended holding only the sign-in image. Ids come from
#    `testID` props: immune to copy edits and to translation.
#
# 2. **Navigation is by deep link, not by tapping the nav.** Below 768pt the
#    shell hides `SidebarNav` behind a hamburger, so a tap sequence written for
#    the iPad silently captures nothing on the iPhone, and vice versa. Deep
#    links behave identically on both, which is the whole point when the matrix
#    has to produce the same screens at two different sizes.
#
# The waits are not decoration. If a deep link ever stops resolving, the app
# stays where it is and the run would photograph the same screen twice; each
# `extendedWaitUntil` below asserts the destination's own heading, so that
# fails here instead of shipping duplicates to a listing.
#
# The `.*Open in.*` block after every `openLink` handles iOS's deep-link
# confirmation sheet. It usually does not appear for an app opening its own
# scheme, which is why it is conditional rather than an unconditional tap - but
# when it does appear it swallows the navigation silently.

- launchApp:
    clearState: true

# NOT `assertVisible` with a timeout. `assertVisible` takes a selector and
# nothing else - passing `timeout` makes Maestro reject the whole file with
# "Unknown Property: timeout" before a single command runs, which is how the
# first attempt at this flow died. Waiting longer than the built-in 7s is what
# `extendedWaitUntil` is for, and a cold first launch needs longer than 7s.
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 60000

- takeScreenshot: screenshots/00-sign-in

- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_DEMO_EMAIL}

- tapOn:
    id: "sign-in-password"
- inputText: ${MAESTRO_DEMO_PASSWORD}

- hideKeyboard

- tapOn:
    id: "sign-in-submit"

# Home can take a moment: the session restores and the first queries resolve.
- extendedWaitUntil:
    visible:
      id: "home-layout"
    timeout: 90000

# First-run coach marks would otherwise sit on top of every listing image. They
# are keyed off server-side preferences, so whether they appear depends on the
# demo account's history rather than on anything in this repo - hence a
# conditional dismissal rather than an unconditional tap.
- runFlow:
    when:
      visible:
        id: "tour-tooltip-card"
    commands:
      - tapOn:
          id: "tour-skip-all"
      - waitForAnimationToEnd:
          timeout: 5000

- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/01-home

- openLink:
    link: ${APP_LINK}modules/cbt
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Cognitive Behavioral Therapy"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/02-cbt

- openLink:
    link: ${APP_LINK}tools/mood-tracker
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Check-in"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/03-mood

- openLink:
    link: ${APP_LINK}tools/journal
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Journal"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/04-journal

- openLink:
    link: ${APP_LINK}tools/breathing
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Breathing exercises"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/05-breathing

- openLink:
    link: ${APP_LINK}progress
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Insights"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/06-insights

- openLink:
    link: ${APP_LINK}tools
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "Standalone trackers any module can call into. Use them on their own, too."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: screenshots/07-tools
