<script>
(function () {
  "use strict";

  // ---------- tool registry (mirrors src/features/notifications/registry.ts + tool-accent.ts) ----------

  var TOOLS = {
    mood:       { label: "Mood",       accent: "be",    record: true  },
    journal:    { label: "Journal",    accent: "ink",   record: true  },
    gratitude:  { label: "Gratitude",  accent: "think", record: true  },
    sleep:      { label: "Sleep",      accent: "ink",   record: true  },
    habits:     { label: "Habits",     accent: "act",   record: true  },
    cbt:        { label: "CBT",        accent: "iris",  record: true  },
    grounding:  { label: "Grounding",  accent: "clay",  record: false },
    breathing:  { label: "Breathing",  accent: "aqua",  record: false },
    meditation: { label: "Meditation", accent: "iris",  record: false }

  // ---------- icons (compact inline SVG, Material-ish) ----------
  var P = {

    route: "M6 19a3 3 0 100-6 3 3 0 000 6zM18 11a3 3 0 100-6 3 3 0 000 6zM6 13V9a3 3 0 013-3h6",
    insights: "M4 19V5M4 19h16M8 15l3-4 3 2 4-6",
    mood: "M12 21a9 9 0 100-18 9 9 0 000 18zM9 10h.01M15 10h.01M8.5 14a4 4 0 007 0",
    journal: "M5 4h11l3 3v13H5zM9 4v16M12 9h4M12 13h4",

    grounding: "M12 6a2 2 0 100-4 2 2 0 000 4zM12 6v13M6 12H4a8 8 0 0016 0h-2M12 19a8 8 0 004-1.2",
    meditation: "M12 6a2 2 0 100-4 2 2 0 000 4zM4 20c1-4 4-6 8-6s7 2 8 6M12 14l-5 2M12 14l5 2",
    sleep: "M20 14a8 8 0 11-9-11 6 6 0 009 11z",
    habits: "M9 11l3 3 8-8M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9",
    cbt: "M9 3a4 4 0 00-2 7.5A3 3 0 007 16a3 3 0 003 3V3zM15 3a4 4 0 012 7.5A3 3 0 0117 16a3 3 0 01-3 3V3z",
    act: "M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v6l4 2",
    settings: "M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 00-1.7-1L14.5 3h-4l-.3 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.5L6 11a7 7 0 000 2l-2 1.5 2 3.5 2.4-1a7 7 0 001.7 1l.3 2.5h4l.3-2.5a7 7 0 001.7-1l2.4 1 2-3.5-2-1.5a7 7 0 00.1-1z",

    down: "M6 9l6 6 6-6",
    drag: "M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01",

    bell: "M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6zM10 20a2 2 0 004 0"
  };
  function svg(name, size) {
    size = size || 18;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="' + (P[name] || "") + '"/></svg>';
  }
  function toolChipHTML(key, size) {
    var t = TOOLS[key];
    return '<span class="icon-chip sm" style="background:hsl(var(--' + t.accent + ')/.15);color:hsl(var(--' + t.accent + '))">' +
      svg(key, size || 14) + '</span>';
  }

  // paint sidebar icons
  document.querySelectorAll(".nav-item .ic").forEach(function (el) { el.innerHTML = svg(el.getAttribute("data-i"), 18); });

  // ---------- seed data (real content, in-memory only) ----------
  var routines = [
    { id: "r1", name: "Morning wind-up", enabled: true, reminder: "07:30",
      steps: ["breathing", "mood", "journal"], done: ["breathing"] },
    { id: "r2", name: "Midday check-in", enabled: true, reminder: "13:00",
      steps: ["mood", "grounding"], done: ["mood", "grounding"] },
    { id: "r3", name: "Evening reset", enabled: true, reminder: null,
      steps: ["gratitude", "sleep"], done: [] },
    { id: "r4", name: "Anxious moment", enabled: false, reminder: null,
      steps: ["breathing", "cbt"], done: [] }
  ];

  function status(r) {
    var active = r.steps;
    var done = r.done.filter(function (s) { return active.indexOf(s) !== -1; });
    if (!r.enabled) return { key: "paused", label: "Paused", cls: "pill-muted" };
    if (done.length === 0) return { key: "not", label: "Not started", cls: "pill-muted" };
    if (done.length === active.length) return { key: "done", label: "Complete", cls: "pill-ok" };
    return { key: "wip", label: done.length + " of " + active.length + " done today", cls: "pill-wip" };
  }
  function reminderPill(r) {
    if (r.reminder) return '<span class="pill pill-muted tnum">' + svg("bell", 13) + " " + r.reminder + "</span>";
    return '<span class="pill pill-muted">' + svg("bell", 13) + " No reminder</span>";
  }

  // ---------- shared step-list editor (used by B accordion + A sheet + C builder) ----------
  function moveStep(r, i, dir) {
    var j = i + dir;
    if (j < 0 || j >= r.steps.length) return;
    var tmp = r.steps[i]; r.steps[i] = r.steps[j]; r.steps[j] = tmp;
    render();
  }
  function removeStep(r, i) { r.steps.splice(i, 1); render(); }
  function addStep(r, key) { if (r.steps.indexOf(key) === -1) { r.steps.push(key); render(); } }
  function toggleEnabled(r) { r.enabled = !r.enabled; render(); }
  function toggleReminder(r) { r.reminder = r.reminder ? null : "08:00"; render(); }

  function paletteHTML(r) {
    return Object.keys(TOOLS).map(function (key) {
      var t = TOOLS[key], used = r.steps.indexOf(key) !== -1;
      return '<button class="palette-chip" data-add="' + r.id + ':' + key + '"' + (used ? " disabled" : "") + '>' +
        toolChipHTML(key, 13) + t.label +
        (t.record ? "" : ' <span class="badge-rec" title="no dated record yet — open question">?</span>') +
        '</button>';
    }).join("");
  }

  function stepEditorHTML(r) {
    var rows = r.steps.map(function (key, i) {
      var t = TOOLS[key];
      return '<div class="step-edit-row">' +
        '<span class="handle" title="drag to reorder">' + svg("drag", 18) + '</span>' +
        toolChipHTML(key, 15) +
        '<span class="grow">' + t.label +
          (t.record ? "" : ' <span class="muted" style="font-size:12px">· no record yet</span>') + '</span>' +
        '<span class="row" style="gap:6px">' +
          '<button class="icon-btn" data-move="' + r.id + ':' + i + ':-1"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">' + svg("up", 15) + '</button>' +
          '<button class="icon-btn" data-move="' + r.id + ':' + i + ':1"' + (i === r.steps.length - 1 ? " disabled" : "") + ' aria-label="Move down">' + svg("down", 15) + '</button>' +
          '<button class="icon-btn" data-remove="' + r.id + ':' + i + '" aria-label="Remove step">' + svg("x", 15) + '</button>' +
        '</span></div>';
    }).join("");
    return rows +
      '<div class="field-label">Add a step</div>' +
      '<div class="palette">' + paletteHTML(r) + '</div>' +
      '<div class="field-label">Daily reminder</div>' +
      '<div class="row between card" style="padding:11px 14px">' +
        '<span class="row" style="gap:9px">' + svg("bell", 16) +
          (r.reminder ? '<b class="tnum">' + r.reminder + '</b>' : '<span class="muted">Off — opt in</span>') + '</span>' +
        '<button class="toggle" role="switch" aria-checked="' + (r.reminder ? "true" : "false") + '" data-rem="' + r.id + '"></button>' +
      '</div>';
  }

  // =========================================================
  // VARIANT A — list of cards + full editor sheet
  // =========================================================
  function renderA(mount) {
    var cta = '<div class="row between" style="margin-bottom:18px">' +
        '<span class="muted">' + routines.length + ' routines · equal footing, all checked daily</span>' +
        '<button class="btn btn-primary" data-new="1">' + svg("add", 17) + 'New routine</button></div>';
    var cards = routines.map(function (r) {
      var st = status(r);
      var strip = r.steps.map(function (k) {
        return '<span class="step-chip">' + toolChipHTML(k, 13) + TOOLS[k].label + '</span>';
      }).join("");
      return '<div class="card routine-card">' +
        '<div class="row between">' +
          '<div class="row" style="gap:11px">' +
            '<span class="status-dot" style="background:hsl(var(--' +
              (st.key === "done" ? "ok" : st.key === "wip" ? "wip" : "border-strong") + '))"></span>' +
            '<b style="font-size:16px">' + r.name + '</b>' +
          '</div>' +
          '<div class="row" style="gap:8px">' + reminderPill(r) +
            '<button class="btn btn-outline btn-sm" data-edit="' + r.id + '">' + svg("edit", 15) + 'Edit</button>' +
          '</div>' +
        '</div>' +
        '<div class="step-strip">' + strip + '</div>' +
        '<div class="row between" style="margin-top:13px">' +
          '<span class="pill ' + st.cls + '">' + st.label + '</span>' +
          '<label class="row muted" style="gap:9px;font-size:13px">' + (r.enabled ? "Active" : "Paused") +
            '<button class="toggle" role="switch" aria-checked="' + (r.enabled ? "true" : "false") + '" data-en="' + r.id + '"></button></label>' +
        '</div>' +
      '</div>';
    }).join("");
    mount.innerHTML = cta + cards;
  }

  function openSheet(r) {
    var isNew = !r;
    if (isNew) { r = { id: "r" + (Date.now() % 100000), name: "", enabled: true, reminder: null, steps: [], done: [] };
      routines.push(r); editingNewId = r.id; }
    var sheet = document.getElementById("sheet");
    sheet.innerHTML = '<div class="grabber"></div>' +
      '<div class="row between" style="margin-bottom:4px"><h2 style="margin:0;font-size:20px">' +
        (isNew ? "New routine" : "Edit routine") + '</h2>' +
        '<button class="icon-btn" data-close="1" aria-label="Close" style="border:none">' + svg("x", 18) + '</button></div>' +
      '<div class="field-label">Name</div>' +
      '<input class="text-input" id="name-field" placeholder="e.g. Morning wind-up" value="' + r.name.replace(/"/g, "&quot;") + '">' +
      '<div class="field-label">Steps · drag to reorder</div>' +
      '<div id="sheet-steps">' + stepEditorHTML(r) + '</div>' +
      '<div class="row between" style="margin-top:22px">' +
        '<button class="btn btn-ghost btn-danger" data-close="1">' + (isNew ? "Discard" : "Delete routine") + '</button>' +
        '<button class="btn btn-primary" data-close="1">Save routine</button></div>';
    document.getElementById("scrim").classList.add("open");
    activeSheetId = r.id;
    var nf = document.getElementById("name-field");
    nf.addEventListener("input", function () { r.name = nf.value; });
  }
  function closeSheet() {
    document.getElementById("scrim").classList.remove("open");
    activeSheetId = null; editingNewId = null;
    render();
  }
  var activeSheetId = null, editingNewId = null;

  // =========================================================
  // VARIANT B — inline accordion, edit in place
  // =========================================================
  var openIds = { r1: true };
  function renderB(mount) {
    var cta = '<div class="row between" style="margin-bottom:18px">' +
        '<span class="muted">Tap a routine to edit it in place</span>' +
        '<button class="btn btn-primary" data-new="1">' + svg("add", 17) + 'New routine</button></div>';
    var items = routines.map(function (r) {
      var st = status(r), open = !!openIds[r.id];
      var icons = r.steps.map(function (k) { return toolChipHTML(k, 13); }).join(" ");
      var head = '<div class="acc-head row between" data-toggle="' + r.id + '">' +
          '<div class="row" style="gap:11px">' + '<span class="chev">' + svg("chev", 18) + '</span>' +
            '<b style="font-size:16px">' + (r.name || "Untitled routine") + '</b>' +
            '<span class="row" style="gap:4px">' + icons + '</span>' +
          '</div>' +
          '<div class="row" style="gap:8px">' + reminderPill(r) + '<span class="pill ' + st.cls + '">' + st.label + '</span></div>' +
        '</div>';
      var body = open ? '<div class="acc-body">' +
          '<div class="field-label">Name</div>' +
          '<input class="text-input" data-name="' + r.id + '" value="' + r.name.replace(/"/g, "&quot;") + '">' +
          '<div class="field-label">Steps · drag to reorder</div>' + stepEditorHTML(r) +
          '<div class="row between" style="margin-top:20px">' +
            '<label class="row muted" style="gap:9px;font-size:13px">' + (r.enabled ? "Active" : "Paused") +
              '<button class="toggle" role="switch" aria-checked="' + (r.enabled ? "true" : "false") + '" data-en="' + r.id + '"></button></label>' +
            '<button class="btn btn-ghost btn-danger btn-sm">Delete routine</button>' +
          '</div>' +
        '</div>' : "";
      return '<div class="card acc-item ' + (open ? "open" : "") + '">' + head + body + '</div>';
    }).join("");
    mount.innerHTML = cta + items;
  }

  // =========================================================
  // VARIANT C — two-pane builder with tool palette
  // =========================================================
  var activeBuildId = "r1";
  function renderC(mount) {
    var rail = routines.map(function (r) {
      var st = status(r);
      return '<div class="rail-item ' + (r.id === activeBuildId ? "active" : "") + '" data-build="' + r.id + '">' +
        '<span class="status-dot" style="background:hsl(var(--' +
          (st.key === "done" ? "ok" : st.key === "wip" ? "wip" : st.key === "paused" ? "muted" : "border-strong") + '))"></span>' +
        '<span class="rail-name grow truncate">' + (r.name || "Untitled") + '</span>' +
        '<span class="muted" style="font-size:12px">' + r.steps.length + '</span></div>';
    }).join("");
    var railHTML = '<div class="card rail"><div class="field-label" style="margin:6px 8px">Routines</div>' + rail +
      '<button class="btn btn-ghost btn-sm" data-new="1" style="width:100%;justify-content:flex-start;margin-top:4px">' +
      svg("add", 16) + 'New routine</button></div>';

    var r = routines.filter(function (x) { return x.id === activeBuildId; })[0] || routines[0];
    var st = status(r);
    var chain = r.steps.length ? r.steps.map(function (key, i) {
      var t = TOOLS[key];
      return '<div class="chain-step">' +
        '<span class="seq">' + (i + 1) + '</span>' + toolChipHTML(key, 16) +
        '<span class="grow"><b>' + t.label + '</b>' +
          (t.record ? "" : ' <span class="muted" style="font-size:12px">· no dated record yet</span>') + '</span>' +
        '<span class="row" style="gap:6px">' +
          '<button class="icon-btn" data-move="' + r.id + ':' + i + ':-1"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">' + svg("up", 15) + '</button>' +
          '<button class="icon-btn" data-move="' + r.id + ':' + i + ':1"' + (i === r.steps.length - 1 ? " disabled" : "") + ' aria-label="Move down">' + svg("down", 15) + '</button>' +
          '<button class="icon-btn" data-remove="' + r.id + ':' + i + '" aria-label="Remove step">' + svg("x", 15) + '</button>' +
        '</span></div>';
    }).join("") : '<div class="muted" style="padding:14px 0">No steps yet — add one below.</div>';

    var pane = '<div class="card builder-pane">' +
      '<div class="row between" style="margin-bottom:6px">' +
        '<input class="text-input" data-name="' + r.id + '" style="font-size:19px;font-weight:700;border:none;padding:6px 0;background:none" value="' + r.name.replace(/"/g, "&quot;") + '">' +
        '<span class="pill ' + st.cls + '">' + st.label + '</span></div>' +
      '<div class="chain">' + chain + '</div>' +
      '<div class="field-label">Add a step · tools that keep a daily record</div>' +
      '<div class="palette">' + paletteHTML(r) + '</div>' +
      '<div class="row between" style="margin-top:20px;border-top:1px solid hsl(var(--border));padding-top:16px">' +
        '<label class="row" style="gap:9px;font-size:13px">' + svg("bell", 16) +
          (r.reminder ? '<b class="tnum">Reminder ' + r.reminder + '</b>' : '<span class="muted">Reminder off</span>') +
          '<button class="toggle" role="switch" aria-checked="' + (r.reminder ? "true" : "false") + '" data-rem="' + r.id + '"></button></label>' +
        '<label class="row muted" style="gap:9px;font-size:13px">' + (r.enabled ? "Active" : "Paused") +
          '<button class="toggle" role="switch" aria-checked="' + (r.enabled ? "true" : "false") + '" data-en="' + r.id + '"></button></label>' +
      '</div></div>';

    mount.innerHTML = '<div class="builder">' + railHTML + pane + '</div>';
  }

  // ---------- annotation per variant (what to react to) ----------
  var ANNO = {
    A: { name: "List + editor sheet", sub: "Scannable list; each routine opens a focused full-screen editor (mirrors the Habits feature: list → detail/editor).",
      points: ["<b>Placement:</b> a <b>Routines</b> item in the Home &amp; Insights sidebar group (per #22) — not a 4th pillar.",
        "<b>Reorder:</b> inside the sheet, via the same react-native-sortables handle used in the Home widget editor, plus up/down arrows for keyboard/a11y.",
        "<b>Enable/disable:</b> a per-routine <b>Active/Paused</b> switch right on the card — pause without deleting.",
        "<b>Open question — offerable tools:</b> the step palette lists all 9 candidates; the <b>?</b>-marked (Grounding, Breathing, Meditation) don't persist a dated record yet, so per #22 they can't yet drive step-completion. Offer only the 6 record-keeping tools, or build records for the others first?"] },
    B: { name: "Inline accordion", sub: "One page; every routine expands in place to edit. No navigating away — good for many equal-footing routines.",
      points: ["<b>Placement:</b> same Routines sidebar item; everything lives on one screen.",
        "<b>Naming/reorder/reminder/enable</b> all edit inline in the expanded card — nothing hidden behind a route.",
        "<b>Trade-off:</b> density. With many routines the page gets tall; expansion keeps only one or two open at a time.",
        "<b>Same open question</b> on which tools are offerable as steps (see the <b>?</b> chips)."] },
    C: { name: "Two-pane builder", sub: "Routine rail + a step-chain builder that makes the 'second-action bridge' visible as a numbered sequence with a tool palette.",
      points: ["<b>Primary affordance:</b> composing the step chain — the numbered connector line renders the routine as an ordered bridge.",
        "<b>Add step:</b> tap a tool in the palette to append it to the chain (reorder with the arrows / drag handle).",
        "<b>Mobile:</b> the two panes stack (rail → builder) below 860px.",
        "<b>Open question</b> unchanged: which tools belong in the palette (record-keeping only, or all?)."] }
  };

  // ---------- variant plumbing ----------
  var VARIANTS = ["A", "B", "C"];
  var NAMES = { A: "List + editor", B: "Inline accordion", C: "Two-pane builder" };
  var current = "A";

  function readVariant() {
    var q = new URLSearchParams(location.search).get("variant");
    if (q && VARIANTS.indexOf(q.toUpperCase()) !== -1) return q.toUpperCase();
    var h = (location.hash || "").replace("#", "").toUpperCase();
    if (VARIANTS.indexOf(h) !== -1) return h;
    return "A";
  }
  function render() {
    var mount = document.getElementById("view");
    if (current === "A") renderA(mount);
    else if (current === "B") renderB(mount);
    else renderC(mount);

    var a = ANNO[current];
    document.getElementById("anno").innerHTML = '<div class="note">' + svg("edit", 18) +
      '<div><b>Variant ' + current + ' — ' + a.name + '.</b> ' + a.sub +
      '<ul>' + a.points.map(function (p) { return "<li>" + p + "</li>"; }).join("") + '</ul></div></div>';

    document.getElementById("sw-label").innerHTML = current + ' <small>· ' + NAMES[current] + '</small>';
    // keep an open sheet in sync if editing under A
    if (current === "A" && activeSheetId) {
      var r = routines.filter(function (x) { return x.id === activeSheetId; })[0];
      if (r) { var ss = document.getElementById("sheet-steps"); if (ss) ss.innerHTML = stepEditorHTML(r); }
    }
  }
  function setVariant(v) {
    current = v;
    if (activeSheetId) closeSheet();
    try { history.replaceState(null, "", "?variant=" + v); } catch (e) { location.hash = v; }
    render();
  }
  function cycle(dir) {
    var i = VARIANTS.indexOf(current);
    setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length]);
  }

  // ---------- delegated events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-move],[data-remove],[data-add],[data-en],[data-rem],[data-edit],[data-new],[data-close],[data-toggle],[data-build]");
    if (!t) return;
    var v;
    if ((v = t.getAttribute("data-move"))) { var p = v.split(":"); moveStep(find(p[0]), +p[1], +p[2]); }
    else if ((v = t.getAttribute("data-remove"))) { var q = v.split(":"); removeStep(find(q[0]), +q[1]); }
    else if ((v = t.getAttribute("data-add"))) { var a = v.split(":"); addStep(find(a[0]), a[1]); }
    else if ((v = t.getAttribute("data-en"))) { toggleEnabled(find(v)); }
    else if ((v = t.getAttribute("data-rem"))) { toggleReminder(find(v)); }
    else if ((v = t.getAttribute("data-edit"))) { openSheet(find(v)); }
    else if (t.hasAttribute("data-new")) { if (current === "A") openSheet(null); else { var nr = { id: "r" + (Date.now() % 100000), name: "New routine", enabled: true, reminder: null, steps: [], done: [] }; routines.push(nr); activeBuildId = nr.id; openIds[nr.id] = true; render(); } }
    else if (t.hasAttribute("data-close")) { closeSheet(); }
    else if ((v = t.getAttribute("data-toggle"))) { openIds[v] = !openIds[v]; render(); }
    else if ((v = t.getAttribute("data-build"))) { activeBuildId = v; render(); }
  });
  document.addEventListener("input", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-name");
    if (id) { var r = find(id); if (r) { r.name = e.target.value; /* live, no full re-render to keep focus */
      // update rail/title lightly for C
      if (current === "C") { var rn = document.querySelector('.rail-item.active .rail-name'); if (rn) rn.textContent = r.name || "Untitled"; } } }
  });
  function find(id) { return routines.filter(function (x) { return x.id === id; })[0]; }

  document.getElementById("prev").addEventListener("click", function () { cycle(-1); });
  document.getElementById("next").addEventListener("click", function () { cycle(1); });
  document.getElementById("scrim").addEventListener("click", function (e) { if (e.target.id === "scrim") closeSheet(); });
  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || (document.activeElement && document.activeElement.isContentEditable)) return;
    if (e.key === "ArrowLeft") cycle(-1);
    else if (e.key === "ArrowRight") cycle(1);
    else if (e.key === "Escape" && activeSheetId) closeSheet();
  });

  current = readVariant();
  render();
})();
</script>
