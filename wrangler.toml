# Cloudflare Workers static-assets deploy — PRODUCTION → selftend.org
# (Netlify-exit spec §4c, control-tower docs/migrations/netlify-exit.md).
# Separate configs keep prod/staging isolated; staging.yml's guard asserts the
# names below never drift onto each other's Worker.
name = "selftend"
compatibility_date = "2026-07-01"

[assets]
directory = "./dist"
# The eight files on the index list answer 200; every other path - the gated
# (app) tree, the (auth) screens, a typo - answers a real 404 with dist/404.html,
# which is the app shell and hydrates into the real screen (docs/indexability.md
# § 6.4, #2295). The export writes 404.html (scripts/apply-index-list.js).
not_found_handling = "404-page"
