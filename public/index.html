<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- quiet-lilac's light page. Overwritten below by the first-paint script
         when a palette or a dark preference is stored; this static value is
         what a first-ever visitor sees. Pinned to THEME_HEXES by
         test/theme-web-surfaces.test.ts. -->
    <meta name="theme-color" content="#f4f2f8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />
    <title>%WEB_TITLE%</title>
    <!-- What Selftend is, for search results and link previews (#1617). Before
         this, every Google snippet and every Discord/Slack/WhatsApp unfurl of
         selftend.org was a bare title with no description and no image.

         The wording is the frame from docs/positioning.md. This file IS scanned
         by test/positioning-copy.test.ts, so a banned phrase here fails verify -
         which is the gate working as intended.

         ⚠️ Static literals, like the palette map below: public/ is copied
         verbatim and `web.output = "single"`, so there is no build step to
         inject a per-page or per-locale value. Expo substitutes only
         %WEB_TITLE% and %LANG_ISO_CODE%.

         ⚠️ NO `og:url`, deliberately. Every route is served this same document,
         so one canonical URL here would tell a crawler that /faq and /crisis are
         the homepage. Omitting it lets each crawler use the URL it actually
         requested, which is correct for all of them.

         ⚠️ `og:image` is the 512x512 app icon - the only share-sized image
         public/ serves - so the card is `summary`, not `summary_large_image`: a
         wide card would letterbox a square icon. A purpose-made 1200x630 image
         would be an upgrade; a tag pointing at one that does not exist would
         not be. -->
    <meta
      name="description"
      content="Selftend is a set of free, private mental health tools: everyday tools for right now, and a CBT programme - cognitive behavioural therapy - to work through when you want one. Open source, no ads, no subscriptions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Selftend" />
    <meta property="og:title" content="Selftend - private mental health tools" />
    <meta
      property="og:description"
      content="Selftend is a set of free, private mental health tools: everyday tools for right now, and a CBT programme - cognitive behavioural therapy - to work through when you want one. Open source, no ads, no subscriptions."
    />
    <meta property="og:image" content="https://selftend.org/favicon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Selftend app icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Selftend - private mental health tools" />
    <meta
      name="twitter:description"
      content="Selftend is a set of free, private mental health tools: everyday tools for right now, and a CBT programme - cognitive behavioural therapy - to work through when you want one. Open source, no ads, no subscriptions."
    />
    <meta name="twitter:image" content="https://selftend.org/favicon-512.png" />
    <script>
      /*
       * First paint follows the stored palette (#584).
       *
       * The bundle cannot do this: the browser paints this document before any
       * JS module runs, so a returning user on `deep-field` would see a flash of
       * quiet-lilac's lilac page before the app root applied its tokens. Inline
       * and synchronous is the whole point - a deferred or external script is
       * already too late.
       *
       * The page backgrounds are duplicated here as literals because this file
       * has no build step that could inject them (`web.output = "single"`, and
       * public/ is copied verbatim). test/theme-web-surfaces.test.ts pins every
       * value to THEME_HEXES, so the copy cannot drift from the palettes.
       *
       * Reads the same two unprefixed localStorage keys AsyncStorage writes on
       * web - see src/stores/style-store.ts.
       */
      (function () {
        var PAGE = {
          "quiet-lilac": ["#f4f2f8", "#15121c"],
          "ink-ivory": ["#fafafa", "#121316"],
          atlas: ["#f7f4ee", "#1f1b14"],
          "deep-field": ["#eef1f6", "#0d1221"],
          "sage-garden": ["#f2f5f0", "#202720"],
          "plum-manuscript": ["#f7f5fa", "#221a2e"],
          "amber-noir": ["#f7f5ed", "#131211"],
          glacier: ["#f1f5f9", "#101a23"],
        };
        try {
          var stored = window.localStorage.getItem("selftend:style");
          var appearance = window.localStorage.getItem("selftend:theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          // "system" and anything unrecognised follow the device, matching the
          // theme store's own resolution rule.
          var dark = appearance === "dark" || (appearance !== "light" && prefersDark);
          var page = (PAGE[stored] || PAGE["quiet-lilac"])[dark ? 1 : 0];
          document.documentElement.style.backgroundColor = page;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", page);
        } catch (error) {
          /* Storage can throw outright (private mode, blocked cookies). The
             static values above are already a correct default, so there is
             nothing to recover - never let a palette stop the app booting. */
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
