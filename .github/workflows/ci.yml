name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Runs checks on merge-queue groups if/when a merge queue is enabled on dev;
  # inert otherwise.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded in-progress runs for the same ref (a new push to a PR branch
# obsoletes the previous run). Push runs on main are serialized per-ref the same way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All three jobs run in PARALLEL: verify is a quality gate, not a build
# prerequisite, and gating the DB jobs on it added its full ~3 minutes to every
# run's wall clock. The trade-off (a lint failure still spends test-job minutes)
# is worth it at this scale.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total;const m=['lines','statements','functions','branches'];let o='| Metric | % | Covered/Total |\n|---|---|---|\n';for(const k of m){const t=s[k];o+='| '+k+' | '+t.pct+'% | '+t.covered+'/'+t.total+' |\n';}console.log(o);" >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set up Supabase CLI
        # Pinned, not `latest`: `latest` makes the action resolve the release
        # through the GitHub API, which got rate-limited and killed two CI jobs
        # on 2026-07-26 (#264) before any test ran. A concrete version skips
        # that call entirely and keeps CI reproducible. Bump deliberately -
        # test/workflow-supabase-cli-pin.test.ts holds every workflow to one pin.
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        id: supabase-start
        # Skip services no test touches (verified: no realtime channels, no
        # edge-function invocations, no image transforms in src/ or test/;
        # studio/meta/logflare/vector are dashboard & telemetry plumbing).
        # mailpit MUST stay: password-reset + signup tests read emails from it.
        # storage-api MUST stay: avatar tests upload to storage.
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,realtime

      - name: Apply seed
        run: supabase db reset

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop local Supabase
        # `always()` alone ran this even when CLI setup failed, so `supabase`
        # was not on PATH and cleanup died with a bare exit 127 that buried the
        # real error (#264). Skip when the start step never ran; still run when
        # it ran and failed, since containers may be up.
        if: always() && steps.supabase-start.outcome != 'skipped'
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set up Supabase CLI
        # Pinned, not `latest`: `latest` makes the action resolve the release
        # through the GitHub API, which got rate-limited and killed two CI jobs
        # on 2026-07-26 (#264) before any test ran. A concrete version skips
        # that call entirely and keeps CI reproducible. Bump deliberately -
        # test/workflow-supabase-cli-pin.test.ts holds every workflow to one pin.
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        id: supabase-start
        # Same exclusions as the integration job (see the comment there).
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,realtime

      - name: Apply seed
        run: supabase db reset

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # Fast no-op when the cache restored the browser build; --with-deps
        # still installs any missing OS packages.
        run: npm exec playwright -- install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright trace artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        # `always()` alone ran this even when CLI setup failed, so `supabase`
        # was not on PATH and cleanup died with a bare exit 127 that buried the
        # real error (#264). Skip when the start step never ran; still run when
        # it ran and failed, since containers may be up.
        if: always() && steps.supabase-start.outcome != 'skipped'
        run: supabase stop
