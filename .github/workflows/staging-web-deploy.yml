name: Staging web deploy (manual)

# MANUAL-ONLY staging deploy: always builds the dev branch and publishes it to
# the separate staging Netlify site via the reusable web workflow, scoped to
# the `staging` GitHub Environment. Deliberately NO push trigger - staging
# web ships only when a human dispatches it (Netlify bills per deploy; the
# push-to-dev pipeline in staging.yml covers database + functions only).
# No inputs by design: the "Use workflow from" dropdown in GitHub's Run
# workflow UI only selects which branch's copy of THIS FILE runs (a GitHub
# constant that cannot be removed) - what gets BUILT is always dev.
#
# Since the push-to-dev pipeline (staging.yml) no longer deploys web (Netlify
# bills per deploy), this manual workflow is the ONLY staging web path - so it
# preserves the staging invariant itself: migrate the staging database first,
# and only deploy web once migrations applied cleanly (same needs: gating as
# staging.yml had).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Staging web must never run against an un-migrated database: apply dev's
  # migrations (idempotent; usually a no-op after the push-to-dev pipeline)
  # before publishing the web bundle.
  migrate-staging:
    name: Migrate staging database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    # Same group as staging.yml's migrate job: serialize database pushes
    # across both workflows; never cancel one mid-flight.
    concurrency:
      group: migrate-staging
      cancel-in-progress: false

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - name: Check migration environment
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set (staging environment secrets) before migrating."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_PROJECT_ID"

      - name: Apply migrations
        run: supabase db push

  # secrets: inherit means a missing staging-Environment NETLIFY_SITE_ID would
  # silently fall back to the repository-level secret - the PRODUCTION site.
  # Refuse to deploy unless the staging Environment supplies its own site id.
  guard:
    name: Assert staging Netlify target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Fail unless NETLIFY_SITE_ID is the staging site's own
        env:
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # The production site id is not a secret (it appears in Netlify URLs);
          # comparing against it catches the silent-fallback case.
          if [ -z "$SITE" ] || [ "$SITE" = "da5b7e44-d551-44ee-b0d8-a7d7a5433433" ]; then
            echo "::error::NETLIFY_SITE_ID resolves to the production site (or is empty) - the staging Environment secret is missing. Refusing to deploy."
            exit 1
          fi

  deploy-web-staging:
    name: Deploy web (staging)
    needs: [migrate-staging, guard]
    uses: ./.github/workflows/web-deploy.yml
    with:
      ref: dev
      environment: staging
    secrets: inherit
