name: Android Play production release

# Reusable build+submit invoked by the release orchestrator (release.yml) after
# migrate-prod, and by android-testing-release.yml with submit_profile=closed
# for the dev-driven testing feed (#374). workflow_dispatch is kept as a manual
# fallback (builds main, releases to production).
#
# The AAB is released to the Play **production** track as `inProgress` with a
# `rollout` fraction (see eas.json) - automatic, but served to a capped share of
# users rather than all of them. A merge to `main` starts reaching users once
# Google's review clears, with nothing to press for it to begin
# (wayfinder #371; the mechanism is research #372).
#
# The cap is for the first releases under this pipeline. `completed` - live to
# everyone - is the intended end state per #371, which decided against a human
# gate. test/android-release-track.test.ts pins whichever mode is current.
#
# What the cap does NOT do is climb by itself. The remaining users get the build
# only when someone bumps the rollout in Play Console or a later release
# supersedes it. That is the one human step left in the pipeline, and it is
# deliberate rather than an oversight.
#
# The consequences, recorded so they are not rediscovered during an incident: a
# bad build reaches the rollout share before anyone can react (100% once this is
# `completed`), Android vitals and Sentry are the only early warning, and Play
# has no rollback - halting stops NEW users receiving it while everyone already
# updated stays put, so the real remedy is shipping a higher versionCode
# forward. See the rollback runbook in docs/releasing.md.
#
# The neighbouring statuses are `completed` (live to everyone) and `draft`
# (uploaded, serving nobody, awaiting a human press). `halted` is the kill
# switch for a rollout under way, not a release mode.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (release tag from the orchestrator)
        type: string
        required: true
      submit_to_play:
        description: Release the AAB to the Google Play production track (capped rollout, live after review)
        type: boolean
        default: true
      submit_profile:
        # `production` -> the production track, mirrored onto Groups + alpha.
        # `closed` -> the Groups track, mirrored onto alpha - the dev-driven
        # testing feed (#374) via android-testing-release.yml.
        description: eas.json submit profile (production or closed)
        type: string
        default: production
      environment:
        description: GitHub Environment providing the app vars and Play secrets
        type: string
        default: production
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: Build the AAB and release it to the Google Play production track (capped rollout, live after review)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'production' }}
    # Job-level (not workflow-level) so it still applies when this file runs as a
    # reusable workflow inside the caller's run. A newer release cancels an
    # in-flight ~90-minute build - the cost guard from decision #15.
    # Scoped per submit profile so the two channels never cancel each other:
    # a dev testing dispatch must not kill an in-flight production release
    # (#374). EAS's remote versionCode counter is atomic per build, so one
    # production and one closed build running concurrently is safe.
    concurrency:
      group: android-release-${{ inputs.submit_profile || 'production' }}
      cancel-in-progress: true

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SUBMIT_TO_PLAY: ${{ inputs.submit_to_play }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: build-artifacts
      EXPO_PUBLIC_DISCORD_URL: ${{ vars.EXPO_PUBLIC_DISCORD_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_GITHUB_REPO_URL: ${{ vars.EXPO_PUBLIC_GITHUB_REPO_URL }}
      EXPO_PUBLIC_PRIVACY_EMAIL: ${{ vars.EXPO_PUBLIC_PRIVACY_EMAIL }}
      EXPO_PUBLIC_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_PUBLIC_APP_URL }}
      EXPO_PUBLIC_SECURITY_EMAIL: ${{ vars.EXPO_PUBLIC_SECURITY_EMAIL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      # Org auth token (sntrys_, CI scopes only) for the @sentry/react-native Gradle
      # source-map upload, so production crashes arrive symbolicated. Diagnosing #199
      # without maps meant hand-symbolicating Hermes bytecode - never again.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Fail-safe: sentry-cli fails the Gradle build when invoked without a token, so
      # if the secret is ever removed/empty, disable the upload instead of breaking
      # the Play release (empty string is falsy in GitHub expressions).
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN && 'false' || 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Build the exact release tag when called from the orchestrator -
          # reproducible and immune to the branch advancing mid-build.
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: ${{ runner.os }}-android-sdk-platform-36-bt-36.0.0-ndk-27.1.12297006

      - name: Prepare Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME" -path "*/bin/sdkmanager" -type f | sort | tail -n 1 || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME."
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/eas
          key: ${{ runner.os }}-android-release-${{ hashFiles('package-lock.json', 'app.config.ts', 'eas.json') }}
          restore-keys: |
            ${{ runner.os }}-android-release-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check release environment
        run: |
          missing=0
          for name in \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_PUBLIC_APP_URL \
            EXPO_PUBLIC_SUPPORT_EMAIL \
            EXPO_PUBLIC_PRIVACY_EMAIL \
            EXPO_PUBLIC_SECURITY_EMAIL
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set as a GitHub repository variable for release builds."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify EAS authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm exec --yes eas-cli -- whoami

      - name: Build signed Android App Bundle locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          npm exec --yes eas-cli -- build --platform android --profile production --local --non-interactive

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: selftend-android-aab-${{ github.run_number }}
          path: build-artifacts/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Write Google Play service account key
        if: ${{ inputs.submit_to_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when ANDROID_SUBMIT_TO_PLAY is true."
            exit 1
          fi

          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > .secrets/google-play-service-account.json

      - name: Release to Google Play
        if: ${{ inputs.submit_to_play }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile || 'production' }}
        run: |
          aab_path="$(find build-artifacts -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [ -z "$aab_path" ]; then
            echo "::error::No Android App Bundle found in build-artifacts."
            exit 1
          fi

          npm exec --yes eas-cli -- submit --platform android --profile "$SUBMIT_PROFILE" --path "$aab_path" --non-interactive

      - name: Mirror the release onto the other tracks
        if: ${{ inputs.submit_to_play }}
        env:
          SUBMIT_PROFILE: ${{ inputs.submit_profile || 'production' }}
        run: |
          # eas submit released the AAB to one track; assign the same
          # versionCode to the tracks downstream of it (Play rejects
          # re-uploading a duplicate versionCode, so we copy the release rather
          # than submit again). Uses the key written above.
          #
          # production run: mirror production -> Groups + alpha. This is the
          # decided FLOOR, not interim scaffolding (#374): after every
          # production release the testing tracks hold at least the bits users
          # have, so testers are never behind. The dev-driven dispatch
          # (android-testing-release.yml) is the ceiling that puts them AHEAD
          # between releases.
          #
          # closed run: eas already released to Groups; mirror Groups -> alpha.
          if [ "$SUBMIT_PROFILE" = "production" ]; then
            node scripts/promote-android-track.cjs --from production --to Groups
            node scripts/promote-android-track.cjs --from production --to alpha
          else
            node scripts/promote-android-track.cjs --from Groups --to alpha
          fi

      - name: Summarise the release
        if: ${{ inputs.submit_to_play }}
        env:
          SUBMIT_PROFILE: ${{ inputs.submit_profile || 'production' }}
        run: |
          if [ "$SUBMIT_PROFILE" = "production" ]; then
            {
              echo "### Android released to production — capped rollout, one action left"
              echo
              echo "The AAB is on the Play **production** track as \`inProgress\`. It starts"
              echo "reaching users as soon as Google's review clears; nothing to press for"
              echo "that. See \`eas.json\` for the current rollout fraction."
              echo
              echo "The closed testing tracks (Groups, alpha) have the same build."
              echo
              echo "**The rollout does not climb by itself.** The remaining users get this"
              echo "build only when someone bumps the rollout in Play Console or a later"
              echo "release supersedes it. Watch Sentry and Android vitals first."
              echo
              echo "Play has no rollback — halting stops NEW users receiving it, but anyone"
              echo "already updated stays on the build. A bad release is fixed by shipping a"
              echo "higher versionCode forward. See \`docs/releasing.md\` → Rollback runbook."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Android released to closed testing (Groups + alpha)"
              echo
              echo "The AAB is on the Play **Groups** track, mirrored onto **alpha**."
              echo "Production is untouched. Testers get it on their next update check;"
              echo "closed tracks have no review latency worth planning around."
              echo
              echo "Its versionCode came from the shared remote counter, so it is higher"
              echo "than the newest production release and testers are now AHEAD of"
              echo "production until the next release supersedes this build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
