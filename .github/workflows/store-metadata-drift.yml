name: Store metadata drift

# Fails when App Store Connect's age-rating declaration stops matching the copy
# committed at store/apple-advisory.json.
#
# WHY THIS EXISTS (#1021, from #1010 / #1013): Selftend was rated 18+ in 173
# countries for an unknown length of time, because two manual overrides sat on
# top of a FREQUENT_OR_INTENSE medical declaration in a web form that nothing in
# the repository mirrored. There was no diff to review and no commit explaining
# why. A live read of App Store Connect was the only way to find it. This job is
# the thing that would have complained.
#
# NO NEW CREDENTIALS. The App Store Connect API key already lives on EAS, not in
# this repository - see the header of ios-release.yml. eas-cli authenticates
# with EXPO_TOKEN, which already exists as a secret, so this adds no .p8, no new
# secret, and nothing for control-tower to inventory.
#
# NOT A REQUIRED CHECK, on purpose. It reads a remote system that a human can
# legitimately change, so it is a weekly alarm rather than a merge gate; a red
# run here means "the two copies disagree", which is a question, not a verdict.
# store/README.md says how to decide which side is wrong. The invariants that
# ARE a merge gate - no manual override, medical never FREQUENT_OR_INTENSE -
# live in test/store-advisory-invariants.test.ts and run in `verify` on every PR.

on:
  schedule:
    - cron: "23 6 * * 1" # 06:23 UTC Mondays
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: store-metadata-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `ASC_APP_ID` and `APPLE_TEAM_ID` are set on the production ENVIRONMENT,
    # not at repository level (docs/releasing.md, step 5). Without this line
    # `vars.*` reads empty and the job fails for a reason that looks like drift.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gated exactly as ios-release.yml is. Until the one-time Apple setup in
      # docs/releasing.md is done there is no API key on EAS to pull with, and a
      # weekly red run for a reason nobody can act on is how a guard gets muted.
      # Skip with a notice; never fail.
      - name: Check the iOS pipeline is set up
        id: gate
        env:
          IOS_RELEASE_ENABLED: ${{ vars.IOS_RELEASE_ENABLED }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$IOS_RELEASE_ENABLED" != "true" ] || [ -z "${ASC_APP_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Store metadata drift check skipped - complete the Apple setup in docs/releasing.md and set IOS_RELEASE_ENABLED, ASC_APP_ID and APPLE_TEAM_ID on the production environment."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # ☠️ WITHOUT THIS THE JOB CANNOT REACH EITHER OF ITS COMPARISONS, and for
      # three weeks it did not (#1798). `eas metadata:pull` evaluates the Expo
      # config to resolve the project, app.config.ts imports
      # `expo/config-plugins`, and `npm exec --yes eas-cli` installs eas-cli
      # into an npx cache without installing this project - so the pull died on
      # "Cannot find module 'expo/config-plugins'" on every scheduled run from
      # the job's first Monday (2026-08-17) onward.
      #
      # That is the muted-guard outcome store/README.md names, on the guard
      # built after Selftend was rated 18+ in 173 countries unnoticed: the job
      # that "is the thing that would have complained" had never once compared
      # anything. ios-release.yml has always installed before calling eas-cli;
      # this job was the copy that left the step out. Keep the two in step.
      #
      # Placed AFTER the gate on purpose, so a skipped run still costs nothing.
      - name: Cache node_modules
        if: steps.gate.outputs.enabled == 'true'
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Same trick, and the same reason, as ios-release.yml: eas-cli does not
      # env-interpolate ascAppId/appleTeamId (only the three ascApiKey* fields),
      # so a committed "$ASC_APP_ID" would be a literal that fails validation.
      # Writing them here keeps Apple identifiers out of the repository.
      - name: Write the Apple identifiers into the submit profile
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          jq --arg app "$ASC_APP_ID" --arg team "$APPLE_TEAM_ID" \
            '.submit.production.ios = ((.submit.production.ios // {}) + {ascAppId: $app, appleTeamId: $team})' \
            eas.json > "$tmp"
          mv "$tmp" eas.json

      - name: Pull the live metadata
        id: pull
        if: steps.gate.outputs.enabled == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm exec --yes eas-cli -- metadata:pull --non-interactive
          test -f store.config.json || {
            echo "::error::metadata:pull produced no store.config.json."
            exit 1
          }

      # Subset comparison, not equality. store/apple-advisory.json holds only
      # the fields actually read from the live record; anything never read is
      # absent rather than guessed, so a guessed value cannot turn this red for
      # a reason that has nothing to do with drift. See store/README.md.
      #
      # A MISSING key and a CHANGED value are reported differently on purpose: a
      # committed key that does not exist in the pulled block almost always
      # means the field name is wrong, and the fix is in this repository, not in
      # App Store Connect.
      - name: Compare against the committed declaration
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          live="$(jq -S '.apple.advisory // {}' store.config.json)"
          want="$(jq -S '.' store/apple-advisory.json)"

          echo "Committed declaration:"
          echo "$want"
          echo "Live apple.advisory (only the committed keys are compared):"
          jq -S --argjson want "$want" 'with_entries(select(.key | IN($want | keys[])))' <<<"$live"

          # ☠️ `select(($live | has(.)) | not)` REBINDS `.` TO $live inside the
          # pipe, so this asked has(<object>) and died with "Cannot check
          # whether object has a object key" on the FIRST key - every run,
          # drift or no drift. Under `set -e` that exit 5 killed the step
          # before the `drifted` report below could print, so the guard could
          # neither pass nor name what it found (#1798). Bind the key first.
          # `drifted` below is already correct: nothing rebinds `.` before
          # `$live[.key]`, so it indexes by the entry's key as intended.
          missing="$(jq -r --argjson live "$live" \
            'keys[] as $k | select(($live | has($k)) | not) | $k' <<<"$want")"
          if [ -n "$missing" ]; then
            echo "::error::These keys are committed but absent from the pulled metadata:"
            echo "$missing"
            echo "::error::That usually means a wrong field name in store/apple-advisory.json - fix it here, not in App Store Connect."
            exit 1
          fi

          drifted="$(jq -r --argjson live "$live" \
            'to_entries[] | select($live[.key] != .value)
             | "\(.key): committed \(.value | tojson), live \($live[.key] | tojson)"' <<<"$want")"
          if [ -n "$drifted" ]; then
            echo "::error::App Store Connect no longer matches store/apple-advisory.json:"
            echo "$drifted"
            echo "::error::Decide which side is wrong - store/README.md explains both cases. Do not silence this check."
            exit 1
          fi

          echo "App Store Connect matches the committed declaration."

      # The listing-text half (#1611). store/apple-info.json holds the fields
      # docs/positioning.md governs, so a silent edit in App Store Connect shows
      # up here the same way an age-rating change does.
      #
      # ☠️ LOCALE-AGNOSTIC ON PURPOSE. These fields live under `apple.info.<locale>`,
      # not `apple.advisory`, and the locale key App Store Connect actually uses
      # was never read - the repository has no store.config.json and nothing else
      # records it. Guessing "en-US" would be exactly the guessed value
      # store/README.md forbids: wrong, it reports a missing key forever and the
      # job gets muted. So the check asks the weaker question it can actually
      # answer honestly - does SOME locale carry this exact value - which still
      # fires the moment Apple's English listing changes. Once someone reads the
      # real locale keys, tighten this to compare per locale.
      # Node rather than jq, unlike the advisory step above: this comparison has
      # real logic in it (search every locale), and scripts/check-store-listing-
      # drift.mjs is unit-tested in `verify` by test/store-listing-drift.test.ts.
      # An untestable comparison inside a weekly guard is how a guard starts
      # lying without anyone noticing.
      # ⚠️ RUNS EVEN WHEN THE ADVISORY COMPARISON ABOVE FAILED. The two
      # comparisons are independent - age rating and listing text - so gating
      # this one on the other's success lets a single age-rating drift hide
      # whatever the listing is doing, for as long as the first takes to
      # resolve. It happened on the first run that got this far (#1798).
      # Condition on the PULL instead, the only step this one actually needs;
      # the job still goes red for either.
      - name: Compare the listing text against the committed copy
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        run: node scripts/check-store-listing-drift.mjs store/apple-info.json store.config.json

      # store.config.json is gitignored and must never become a committed
      # artifact: a partial metadata file is something `eas metadata:push` could
      # send at an app under review.
      - name: Clean up
        if: always()
        run: rm -f store.config.json
