name: Release pipeline

# Production pipeline: on a published GitHub Release (created by release-please
# under the PAT - GITHUB_TOKEN-authored events would not trigger this), migrate
# the production database first, then deploy web + android + edge functions
# independently. workflow_dispatch with a tag input is the manual fallback.
#
# Everything builds from the release tag, never a branch head. The deploy jobs
# `needs:` the migration, so a failed migration aborts the release and nothing
# ships against an un-migrated database (decisions #15 and #17; spec §6).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v0.3.1)
        type: string
        required: true

permissions:
  contents: read

# Deliberately NO workflow-level concurrency: cancel-in-progress there would
# cancel an entire older run even while its migrate-prod job is mid `db push`.
# Instead each job carries its own guard: migrations and function deploys
# serialize without cancellation, while the web/android deploy jobs (in their
# reusable workflows) let a newer release cancel a superseded in-flight deploy.
jobs:
  migrate-prod:
    name: Migrate production database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Serialize database pushes; never cancel one mid-flight.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - name: Check migration environment
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PRODUCTION_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set (production environment secrets) before migrating."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Supabase CLI
        # Pinned, not `latest`: `latest` makes the action resolve the release
        # through the GitHub releases API, which got rate-limited and killed two
        # CI jobs on 2026-07-26 (#264). A concrete version skips that call
        # entirely and keeps deploys reproducible. 2.109.1 is what `latest`
        # itself resolved to on that date, so research R1 (older CLI versions
        # lack the IPv4/Supavisor pooler handling GitHub runners need) is not
        # regressed - this is the same CLI the green runs already used. Bump
        # deliberately - test/workflow-supabase-cli-pin.test.ts holds every
        # workflow to one concrete pin.
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_ID"

      - name: Migration dry-run (log what would apply)
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

  deploy-web:
    name: Deploy web
    needs: migrate-prod
    uses: ./.github/workflows/web-deploy.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      environment: production
    secrets: inherit

  deploy-android:
    name: Deploy android
    needs: migrate-prod
    uses: ./.github/workflows/android-release.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      submit_to_play: true
      environment: production
    secrets: inherit

  # TestFlight, not the App Store — see ios-release.yml. No-ops until the Apple
  # setup is done and IOS_RELEASE_ENABLED is flipped, so it cannot redden a
  # release in the meantime.
  deploy-ios:
    name: Deploy ios
    needs: migrate-prod
    uses: ./.github/workflows/ios-release.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      submit_to_testflight: true
      environment: production
    secrets: inherit

  deploy-functions-prod:
    name: Deploy edge functions
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    # Serialize function deploys; never cancel one mid-flight (a partial
    # multi-function deploy is worse than a briefly stale one).
    concurrency:
      group: deploy-functions-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Supabase CLI
        # Pinned, not `latest` - see the migrate-prod job for why (#264).
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_ID"

      - name: Deploy edge functions
        # Code only; function runtime secrets stay managed in the Supabase
        # project (decision #17).
        run: supabase functions deploy
