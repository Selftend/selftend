name: App Store screenshots

# Produces App Store listing screenshots at Apple's exact required sizes, on the
# free `macos-26` runners, without owning any Apple hardware.
#
# Apple rejects a listing whose screenshots are the wrong dimensions, and because
# app.config.ts sets `supportsTablet: true`, **iPad images are required as well
# as iPhone**. Dropping iPad support would avoid that, but it is a product
# decision rather than a shortcut, so it is not assumed here.
#
#   iPhone 6.9"  1320 x 2868   iPhone 16 Pro Max class
#   iPad 13"     2064 x 2752   iPad Pro 13-inch class
#
# The build is a simulator build and therefore unsigned - no certificate, no
# provisioning profile, no Apple account.
#
# Maestro drives the app because `simctl` cannot type or tap: without it the
# capture stops at the sign-in screen, and a listing showing only a login form
# advertises none of what the app actually does.
#
# The resolution check at the end is the point of the whole job. Silently
# producing almost-right images would be discovered at submission time, which is
# the worst moment to find out.
# STATUS: ☠️ **THE TLS DIAGNOSIS WAS WRONG, and it cost this job two months of
# being written off as unbounded infrastructure work.** Dispatched 2026-09-21
# against a corrected flow, the run built, booted, installed and drove the app,
# and the probe reported the host reaching Supabase at `http=401 tls=0` - a
# healthy, reachable endpoint. ⚠️ The in-simulator half of that same probe
# reports `NSPOSIXErrorDomain code=2`: there is no `curl` inside the simulator
# runtime, so it has never measured anything in either direction.
#
# What actually stopped every run was THREE stale steps in the flow, none of
# them networking:
#   1. step 4 deep-linked `modules/cbt` and waited on "Cognitive Behavioural
#      Therapy", which a gated iOS build can never render;
#   2. the breathing step waited on "Breathing exercises", a string in NO
#      locale file;
#   3. ☠️ the flow predated the age-and-country gate (#1764), which stands in
#      front of sign-in on every cleared launch - so the run waited 60s for
#      `sign-in-email`, which was never going to appear. The Maestro debug
#      artifact's failure screenshot shows that gate.
# All three are fixed (#2610 item 16 and its follow-up).
#
# ☠️ "Every flow-level fault has been fixed" stood here and was WRONG (#2598,
# corrected #2610 item 16). TWO hangs sat behind the TLS one, so fixing #547
# alone would not have produced a set:
#   - step 4 deep-linked `modules/cbt` and waited on "Cognitive Behavioural
#     Therapy", which a gated iOS build can never render;
#   - the breathing step waited on "Breathing exercises", a string that exists
#     in NO locale file at all. Found by grepping every wait text against
#     src/i18n/locales/en/ rather than trusting them.
# Both are fixed now, and this job is NO LONGER DORMANT - see the result below.
# Correcting the flow while it could not run was still the right call: a stale
# flow is not inert, it is a trap that gets re-derived - which is exactly how
# the dead `06-tools` screen reached the live listing and passed App Review.
#
# ✅ RESULT (2026-09-21): the job produces the full set on BOTH devices, at
# Apple's exact sizes. Three fully green runs:
#   35623729810  both devices  (fix/capture-guest-signin - the first both-green)
#   35665756780  both devices
#   35669305674  both devices
# A green run IS the size check: the job verifies every PNG with `sips` and
# fails on `md5` duplicates, so it cannot go green on almost-right images.
# The two fix/capture-flakes commits ahead of that first green run harden the
# iPad half against two flakes; they are not what made it work.
#
# So "repair or retire" (#2613) is answered: REPAIRED. And #547 is not what
# this job was waiting on - the TLS diagnosis above was wrong.
#
# ⚠️ The 0.9.0 listing was shot from the WEB build instead. That route stays
# disqualified (#2598): the module gate is iOS-only, so a web capture
# photographs the very surfaces iOS does not have. But it is no longer the
# alternative either - #2598's fallback of capturing BY HAND from a local
# `simulator`-profile build is overtaken by this job, and #2630's "assumes a
# Mac the project does not have" with it: the free `macos-26` runner is that
# Mac, and this job touches no Apple credentials.
#
# ✅ WHAT IT PHOTOGRAPHS is decided (#2730, map #2652). Until then the flow
# signed into App Review's own PRODUCTION account, which was thin and stale -
# "Nothing yet" five times on Home (#2648) - and no seed could be added,
# because the repo's seed WIPES the target user's rows first.
#
# Now the job builds against STAGING and signs into a dedicated staging
# capture account, and the `seed` job below fills that account with
# `scripts/seed-demo-data.mjs`'s fabricated dataset on EVERY run - not on a
# dispatch input, because the dataset's 89-day window ends "today" and is only
# true on the day something makes it so. `DEMO_ACCOUNT_*` still means App
# Review's production account; this job no longer reads it.
#
# ☠️ The seed runs ONCE, in its own job, and both devices wait for it. Inside
# the matrix it would run twice at the same moment, each wiping the rows the
# other was inserting.
#
# Note `workflow_dispatch` needs this file on the DEFAULT branch (main) before
# it appears at all. It has been there since #549, so dispatch works today and
# the branch to run is chosen in the dispatch form - which is how the runs
# above were triggered from feature branches.
on:
  workflow_dispatch:
    inputs:
      keep_going_on_flow_failure:
        description: Still upload whatever was captured if the Maestro flow fails
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Fills the staging capture account before either device photographs it.
  #
  # ☠️ `environment: capture`, NEVER `staging` or `production`. Both of those
  # also carry deploy credentials (Cloudflare API token, a database password
  # for the project they deploy) that a seeding job has no business near.
  # `capture` holds exactly four secrets: STAGING_PROJECT_ID and
  # STAGING_DB_PASSWORD (copies of staging's - rotate both copies together) and
  # CAPTURE_ACCOUNT_EMAIL / CAPTURE_ACCOUNT_PASSWORD.
  #
  # The script refuses any target that is not local or
  # https://<STAGING_PROJECT_ID>.supabase.co, and refuses production by name
  # (scripts/seed-demo-target.mjs, test/seed-demo-target.test.ts). It creates
  # or updates the capture account pre-confirmed through the admin API - never
  # public signup, which would send an email - and never echoes the password.
  seed:
    name: Seed the staging capture account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: capture
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      SEED_ACCOUNT_EMAIL: ${{ secrets.CAPTURE_ACCOUNT_EMAIL }}
      SEED_ACCOUNT_PASSWORD: ${{ secrets.CAPTURE_ACCOUNT_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the capture environment is provisioned
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD STAGING_PROJECT_ID SEED_ACCOUNT_EMAIL SEED_ACCOUNT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. The capture environment needs all four secrets (#2729)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # The mechanism staging.yml already proves: the access token plus the
      # staging database password. A wrong password or ref fails here, before
      # anything is written.
      - name: Link the staging project
        run: supabase link --project-ref "$STAGING_PROJECT_ID"

      - name: Seed the capture account
        run: |
          # The legacy service_role key first (what supabase-js expects), the new
          # secret key as the fallback. Masked before anything can print it.
          key="$(curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$STAGING_PROJECT_ID/api-keys?reveal=true" \
            | jq -r '(map(select(.name == "service_role")) + map(select(.type == "secret")))[0].api_key // empty')"
          if [ -z "$key" ]; then
            echo "::error::No service-role or secret key came back for the staging project."
            exit 1
          fi
          echo "::add-mask::$key"
          SEED_SUPABASE_URL="https://$STAGING_PROJECT_ID.supabase.co" \
            SEED_SERVICE_ROLE_KEY="$key" \
            node scripts/seed-demo-data.mjs

  capture:
    name: ${{ matrix.label }}
    needs: seed
    runs-on: macos-26
    timeout-minutes: 75
    # `capture`, for the same reason as the seed job: it needs the capture
    # account to sign into and the staging project to build against, and
    # nothing that deploys. ☠️ Never `production` - that would hand a simulator
    # job the production deploy credentials. The environment's own VARIABLES
    # EXPO_PUBLIC_SUPABASE_URL / _PUBLISHABLE_KEY (staging's, both public) take
    # precedence over the repo-level production ones in `vars.` below, which is
    # what points the build at staging; the first check below proves it did.
    environment: capture

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPhone 6.9 inch
            slug: iphone-6.9
            device_pattern: "^iPhone 1[6-9] Pro Max$"
            expect_width: 1320
            expect_height: 2868
          - label: iPad 13 inch
            slug: ipad-13
            device_pattern: "^iPad Pro 13-inch"
            expect_width: 2064
            expect_height: 2752

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_PUBLIC_APP_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      EXPO_PUBLIC_PRIVACY_EMAIL: ${{ vars.EXPO_PUBLIC_PRIVACY_EMAIL }}
      EXPO_PUBLIC_SECURITY_EMAIL: ${{ vars.EXPO_PUBLIC_SECURITY_EMAIL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_GITHUB_REPO_URL: ${{ vars.EXPO_PUBLIC_GITHUB_REPO_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      # ☠️ WITHOUT THIS THE SIMULATOR REPORTS INTO PRODUCTION SENTRY AS A USER,
      # and for weeks it did (#2726). src/lib/sentry.ts reads
      # `EXPO_PUBLIC_APP_ENV ?? "production"`, and this job set the DSN but never
      # the environment - so every hang this runner produced landed in the
      # production issue stream. Five App Hang issues arrived in 24 hours on
      # 2026-09-21/22, all of them this one iPad simulator, one of them "fully
      # blocked for 11.2-12.0 seconds" (an asset catalog paging in on first touch
      # of a text field, on a cold VM). A fresh simulator per run means a fresh
      # random user id per run, so they inflate "users impacted" too: SELFTEND-7
      # reads 10 users and an unknown share of them are this job.
      #
      # The DSN's own comment says events "are told apart by environment"; this
      # job simply told it nothing.
      #
      # ⚠️ NEVER SET THIS TO `development`. The same variable feeds
      # src/lib/env.ts's `appEnvName`, which src/lib/module-visibility.ts gates
      # the three modules on - `MODULE_VISIBLE_APP_ENVS = ["development"]`. That
      # value here would put CBT, DBT and ACT into the App Store screenshots,
      # publishing gated modules as pixels. The index-list guard from #2715 runs
      # in `verify` and CANNOT see a workflow env var, so nothing would go red.
      # Any other value hides them, exactly as the unset default did.
      # test/capture-sentry-environment.test.ts holds both halves.
      EXPO_PUBLIC_APP_ENV: capture
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      BUNDLE_ID: org.vasilyoshev.selftend
      ARTIFACT_DIR: build-artifacts
      # The staging capture account the seed job just filled (#2730). Never a
      # real account: these images are published publicly and the app holds
      # private mental-health writing. Not DEMO_ACCOUNT_*, which is App
      # Review's production account and is none of this job's business.
      MAESTRO_DEMO_EMAIL: ${{ secrets.CAPTURE_ACCOUNT_EMAIL }}
      MAESTRO_DEMO_PASSWORD: ${{ secrets.CAPTURE_ACCOUNT_PASSWORD }}
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Check required config and demo credentials
        run: |
          missing=0
          for name in \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_PUBLIC_APP_URL \
            MAESTRO_DEMO_EMAIL \
            MAESTRO_DEMO_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Without it the run captures an unconfigured app or stops at sign-in."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          # ☠️ The seed wrote to STAGING. A build pointed anywhere else would sign
          # into a different project and photograph whatever is there - or, if the
          # capture environment's variables were ever deleted, fall back to the
          # repo-level PRODUCTION values without a word. So it has to match.
          if [ "$EXPO_PUBLIC_SUPABASE_URL" != "https://$STAGING_PROJECT_ID.supabase.co" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL is not the staging project the seed wrote to. Set the capture environment's EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY variables to staging's."
            exit 1
          fi

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'patches/**') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # ☠️ The installer exits 0 even when it installed nothing, so this step
      # checks its own work. Measured on run 35618755971: the download took a
      # 504 from the CDN, the script printed "Downloaded zip archive is corrupt"
      # and returned success anyway. The job then carried on for twenty minutes,
      # built the app, booted the simulator, and died in the drive step with
      # `maestro: command not found` - after which the verify step reported
      # ⚠️ **"screenshots/01-home.png is missing - the capture flow did not reach
      # that screen"**, which is a true sentence about an entirely innocent
      # flow. A transient CDN error must not read as a capture failure.
      #
      # Retried once rather than failed outright, because a 504 is exactly the
      # kind of thing that succeeds on a second ask - and this job is a
      # forty-five minute round trip.
      - name: Install Maestro
        run: |
          install_maestro() {
            curl -fsSL "https://get.maestro.mobile.dev" | bash
          }

          install_maestro || true
          export PATH="$HOME/.maestro/bin:$PATH"

          if ! maestro --version >/dev/null 2>&1; then
            echo "::warning::Maestro did not install on the first attempt. Retrying once."
            sleep 15
            install_maestro || true
          fi

          if ! maestro --version >/dev/null 2>&1; then
            echo "::error::Maestro failed to install - the download is unavailable or corrupt. This is an installer/CDN failure, NOT a capture failure."
            exit 1
          fi

          maestro --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build for the simulator
        run: |
          mkdir -p "$ARTIFACT_DIR"
          npm exec --yes eas-cli -- build \
            --platform ios \
            --profile simulator \
            --local \
            --non-interactive \
            --output "$ARTIFACT_DIR/selftend-simulator.tar.gz"

      - name: Unpack the app bundle
        id: unpack
        run: |
          cd "$ARTIFACT_DIR"
          tar -xzf selftend-simulator.tar.gz
          app_path="$(find . -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::No .app bundle in the simulator build output."
            exit 1
          fi
          echo "app_path=$ARTIFACT_DIR/${app_path#./}" >> "$GITHUB_OUTPUT"

      - name: Boot the target device
        id: boot
        env:
          PATTERN: ${{ matrix.device_pattern }}
        run: |
          # Matched by pattern rather than an exact name: simulator device names
          # change between Xcode releases, and a pinned name would silently stop
          # existing - producing a confusing failure unrelated to the app.
          udid="$(xcrun simctl list devices available -j \
            | jq -r --arg p "$PATTERN" '[.devices[][] | select(.name | test($p))] | last.udid // empty')"

          if [ -z "$udid" ]; then
            echo "::error::No available simulator matching /$PATTERN/. Apple's required screenshot size cannot be produced without it."
            xcrun simctl list devices available | grep -E "iPhone|iPad" || true
            exit 1
          fi

          name="$(xcrun simctl list devices available -j | jq -r --arg u "$udid" '[.devices[][] | select(.udid == $u)] | .[0].name')"
          echo "Booting $name"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # A clean status bar: no carrier noise, full battery, a fixed clock.
          xcrun simctl status_bar "$udid" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install the app
        env:
          UDID: ${{ steps.boot.outputs.udid }}
          APP_PATH: ${{ steps.unpack.outputs.app_path }}
        run: xcrun simctl install "$UDID" "$APP_PATH"

      # The app reported "A TLS error caused the secure connection to fail"
      # against Supabase from inside the simulator, which is what actually kept
      # every earlier run stuck on the sign-in screen. This probe separates the
      # three things that error could mean - DNS, host reachability, or
      # something specific to the app's own networking stack - so the next
      # failure does not need another 40-minute build to narrow down.
      - name: Probe Supabase reachability from host and simulator
        if: always()
        continue-on-error: true
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          host="${EXPO_PUBLIC_SUPABASE_URL#https://}"
          echo "--- DNS (host) ---"
          dig +short "$host" || true
          echo "--- TLS handshake (host) ---"
          curl -sS -o /dev/null -w 'http=%{http_code} tls=%{ssl_verify_result} time=%{time_total}\n' \
            "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/health" || echo "host curl FAILED"
          echo "--- TLS handshake (inside the simulator runtime) ---"
          xcrun simctl spawn "$UDID" curl -sS -o /dev/null -w 'http=%{http_code} tls=%{ssl_verify_result}\n' \
            "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/health" || echo "simulator curl FAILED"

      - name: Drive the app and capture
        id: flow
        # `|| false` is load-bearing. On any event that is not workflow_dispatch
        # `inputs` is empty, the expression evaluates to '' and Actions rejects
        # the whole job template with "Unexpected value ''" - but only AFTER the
        # step has already failed, so the real error is buried under a template
        # error that looks unrelated.
        continue-on-error: ${{ inputs.keep_going_on_flow_failure || false }}
        env:
          UDID: ${{ steps.boot.outputs.udid }}
          # Maestro's default wait for the XCUITest driver is far too short for
          # a loaded free macOS runner. Raising it is necessary but NOT
          # sufficient - see the retry below.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          mkdir -p screenshots maestro-debug

          # Maestro's XCUITest driver intermittently never comes up on these
          # runners: "iOS driver not ready in time", after the job has already
          # spent ~30 minutes building. It is not the flow - the driver has
          # started fine on this same image and Xcode repeatedly - and it is not
          # the timeout, because one failure sat there for the full 5m33s before
          # giving up. So it is retried once, with the simulator restarted in
          # between, which is the only lever that actually clears the stuck
          # XCTest runner.
          #
          # --debug-output keeps Maestro's view-hierarchy dumps and per-command
          # screenshots; each attempt writes to its own subdirectory so a retry
          # cannot overwrite the evidence from the attempt that failed.
          run_flow() {
            maestro --device "$UDID" test \
              --debug-output "maestro-debug/attempt-$1" \
              .maestro/app-store-screenshots.yaml
          }

          # ☠️ THREE ATTEMPTS, NOT TWO, AND THE THIRD IS NOT PADDING.
          #
          # The app's first screen only renders once `signInAnonymously` has
          # returned, so a slow or dropped call to Supabase does not surface as
          # a network error - it surfaces as the age gate never appearing, and
          # then as `age-gate-day is visible... FAILED` ninety seconds later,
          # which reads like a broken selector.
          #
          # ⚠️ Measured on the iPad of run 35658173440: attempt 1 cleared that
          # gate and got all the way to Home, and attempt 2 - immediately after
          # a simulator restart - failed on it with nothing else in the log. The
          # flow and the selector were both fine; the restart simply landed in a
          # worse moment. A run that has already spent twenty minutes building
          # should not be thrown away on that.
          #
          # In-flow recovery was the first instinct and is not available: it
          # needs `optional:` on `extendedWaitUntil`, which documents only
          # `visible` and `timeout`, and an unknown property makes Maestro
          # reject the whole file before a single command runs.
          attempt_with_restart() {
            echo "::warning::Maestro attempt $(( $1 - 1 )) failed. Restarting the simulator and retrying."
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            run_flow "$1"
          }

          if run_flow 1; then
            exit 0
          fi

          if attempt_with_restart 2; then
            exit 0
          fi

          attempt_with_restart 3

      # `takeScreenshot` paths are documented as relative to Maestro's workspace
      # directory, not to the job's working directory - so depending on how the
      # workspace is inferred, the PNGs can land in `.maestro/screenshots/`
      # rather than `./screenshots/`. Rather than bet on which, gather them.
      #
      # ☠️☠️ MATCH ON THE DIRECTORY, NOT JUST THE FILENAME. This search used to
      # be `-name '0[0-9]-*.png'` across the whole checkout, and that was wrong
      # twice over - measured on the 2026-09-21 run, whose uploaded artifact
      # contains every file named below:
      #
      #   1. **It swept the repository's own images in.** 67 tracked PNGs match
      #      `0[0-9]-*.png` - design records under `docs/design/`, campaign
      #      captures, web landing shots - and every one of them is the wrong
      #      pixel size. The size gate below would have failed on all 67, so
      #      ⚠️ **this job could never have passed, however perfect the
      #      capture.** That is a second false blocker sitting behind the flow's
      #      own, and it would have been read as "the captures are wrong".
      #
      #   2. ☠️ **It swept the SIGN-IN FRAME into the publishable set.**
      #      `diagnostics/00-sign-in.png` matches the pattern, and the skip
      #      below only excluded `./screenshots/*` - so the login screenshot was
      #      copied into `screenshots/` and uploaded as part of the App Store
      #      artifact. The flow file claimed this was impossible by
      #      construction; it was not. Guideline 2.3.3 names login pages
      #      explicitly, and #2598 chose structure over discipline precisely so
      #      this could not happen. Now it cannot: `diagnostics/` is not a
      #      `screenshots/` directory, so the path match excludes it outright.
      #
      # There is no directory named exactly `screenshots` anywhere in the repo
      # (checked), so `*/screenshots/` matches Maestro's output and nothing
      # else. `store/play-screenshots/` does not match - the path component has
      # to be `screenshots` exactly.
      - name: Gather the captured screenshots
        if: always()
        run: |
          mkdir -p screenshots diagnostics
          while IFS= read -r found; do
            case "$found" in
              ./screenshots/*) continue ;;
            esac
            echo "found $found"
            cp -f "$found" "screenshots/$(basename "$found")"
          done < <(find . \( -path ./node_modules -o -path "./$ARTIFACT_DIR" \) -prune -o -path '*/screenshots/0[0-9]-*.png' -print)
          ls -la screenshots/ || true

          # Diagnostic captures are gathered separately and never enter
          # screenshots/, so they cannot trip the size or duplicate gates.
          while IFS= read -r found; do
            case "$found" in
              ./diagnostics/*) continue ;;
            esac
            cp -f "$found" "diagnostics/$(basename "$found")"
          done < <(find . \( -path ./node_modules -o -path "./$ARTIFACT_DIR" \) -prune -o -path '*/diagnostics/*.png' -print)
          ls -la diagnostics/ || true

      # The reason this job exists. Wrong-sized images are accepted by nothing
      # and would be discovered at submission - the worst possible moment.
      #
      # Three separate failure modes, because each one produces a plausible-
      # looking artifact that would waste a submission attempt:
      #   - a screen missing entirely (the flow stopped early),
      #   - an image at the wrong size (Apple rejects the upload),
      #   - two identical images (a deep link no-opped and the same screen was
      #     photographed twice).
      - name: Verify the screenshots are complete and Apple's required size
        env:
          EXPECT_W: ${{ matrix.expect_width }}
          EXPECT_H: ${{ matrix.expect_height }}
        run: |
          # Keep in step with .maestro/app-store-screenshots.yaml.
          #
          # The decided publishable set, five per device (#2598). What left, and
          # why, so nobody re-derives the old list:
          #   - 00-sign-in  -> diagnostics/, NOT published: guideline 2.3.3 names
          #                    login pages explicitly. Outside this pattern by
          #                    construction, so it cannot reach these gates.
          #   - 02-cbt      -> dropped. The modules are gated on iOS, so a gated
          #                    build can never render that screen.
          #   - 06-tools    -> dropped. It photographed the Tools hub, which has
          #                    been `<Redirect href="/" />` since #2114 - a screen
          #                    no build on any platform can open. It was published
          #                    anyway, and passed App Review.
          #   - 03-mood     -> renamed 02-check-in, the label the app has used
          #                    since #1968.
          required=(
            01-home
            02-check-in
            03-journal
            04-breathing
            05-gratitude
          )

          bad=0
          for name in "${required[@]}"; do
            if [ ! -f "screenshots/$name.png" ]; then
              echo "::error::screenshots/$name.png is missing - the capture flow did not reach that screen."
              bad=1
            fi
          done

          shopt -s nullglob
          files=(screenshots/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No screenshots were captured at all."
            exit 1
          fi

          for f in "${files[@]}"; do
            w="$(sips -g pixelWidth  "$f" | awk '/pixelWidth/  {print $2}')"
            h="$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')"
            if [ "$w" = "$EXPECT_W" ] && [ "$h" = "$EXPECT_H" ]; then
              echo "ok   $(basename "$f")  ${w}x${h}"
            else
              echo "::error::$(basename "$f") is ${w}x${h}, Apple requires ${EXPECT_W}x${EXPECT_H}."
              bad=1
            fi
          done

          # The status bar is frozen to a fixed clock and battery above, so two
          # captures of the same screen really are byte-identical. Anything that
          # collides here is a navigation that silently did nothing.
          dupes="$(md5 -q "${files[@]}" | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Two or more screenshots are identical - navigation did not happen between captures."
            md5 -r "${files[@]}" | sort
            bad=1
          fi

          [ "$bad" -eq 0 ]

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ matrix.slug }}-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostic captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.slug }}-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      # `include-hidden-files` is required, not optional. Maestro writes its
      # debug output to `maestro-debug/.maestro/tests/<timestamp>/`, and
      # upload-artifact skips dot-paths by default - so the first run with
      # --debug-output uploaded an empty artifact and the view hierarchy that
      # would have explained the failure was silently dropped.
      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ matrix.slug }}-${{ github.run_number }}
          path: maestro-debug/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarise
        if: always()
        env:
          DEVICE_NAME: ${{ steps.boot.outputs.name }}
        run: |
          {
            echo "### ${{ matrix.label }} - ${DEVICE_NAME:-unknown}"
            echo
            echo "Target size: **${{ matrix.expect_width }} x ${{ matrix.expect_height }}**"
            echo
            echo "Captured with the seeded STAGING capture account, never a real one -"
            echo "these images go on a public listing and the app holds private writing."
            echo
            echo "Review them before uploading. Apple rejects screenshots that"
            echo "misrepresent the app, and overlay text (if any is added later) is"
            echo "user-facing copy in the owner's voice."
          } >> "$GITHUB_STEP_SUMMARY"
