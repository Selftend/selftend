name: Web deploy

# Reusable deploy invoked by the release orchestrator (release.yml) after
# migrate-prod, and by the staging pipeline (staging.yml) with staging inputs.
# workflow_dispatch is kept as a manual fallback (deploys main to production).
# Target: Cloudflare Workers static assets (Netlify-exit spec §4c) — the
# environment selects the wrangler config (prod: wrangler.toml → Worker
# "selftend"; staging: wrangler.staging.toml → "selftend-staging").
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (release tag from the orchestrator)
        type: string
        required: true
      environment:
        description: GitHub Environment providing the Netlify site + app vars
        type: string
        default: production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Web To Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    # Job-level (not workflow-level) so it still applies when this file runs as a
    # reusable workflow inside the caller's run. A newer deploy to the same
    # environment supersedes an in-flight one.
    concurrency:
      group: web-deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: true

    env:
      EXPO_PUBLIC_APP_ENV: ${{ vars.EXPO_PUBLIC_APP_ENV }}
      EXPO_PUBLIC_APP_STORE_URL: ${{ vars.EXPO_PUBLIC_APP_STORE_URL }}
      EXPO_PUBLIC_DISCORD_URL: ${{ vars.EXPO_PUBLIC_DISCORD_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_GITHUB_REPO_URL: ${{ vars.EXPO_PUBLIC_GITHUB_REPO_URL }}
      EXPO_PUBLIC_PLAY_STORE_URL: ${{ vars.EXPO_PUBLIC_PLAY_STORE_URL }}
      EXPO_PUBLIC_PRIVACY_EMAIL: ${{ vars.EXPO_PUBLIC_PRIVACY_EMAIL }}
      EXPO_PUBLIC_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_PUBLIC_APP_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SECURITY_EMAIL: ${{ vars.EXPO_PUBLIC_SECURITY_EMAIL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      # ☠️ Omitted from this block from the workflow's first commit until #2263,
      # while the `production` and `staging` environments both HELD the key and
      # #89 recorded web push as live. Expo inlines EXPO_PUBLIC_* at export
      # time, so every deployed bundle carried `webPushVapidPublicKey:""`: on
      # web the reminder offer ended in "Reminders aren't configured for this
      # app build" for every target, and the reminders screen wrote its columns
      # with nothing able to deliver them. Setting the variable did nothing
      # while this line was missing. test/web-deploy-public-env.test.ts now
      # pins this block against the keys src/lib/env.ts reads.
      EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Build the exact release tag when called from the orchestrator -
          # reproducible and immune to the branch advancing mid-build.
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Whether THIS deployment is the one that ships browser reminders. The
          # upstream repo's `production` and `staging` environments both hold the
          # VAPID key and the edge function holds its private half; a fork runs
          # neither, and must still be able to deploy the site.
          IS_UPSTREAM: ${{ github.repository == 'Selftend/selftend' }}
        run: |
          missing=0
          for name in \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_PUBLIC_APP_URL \
            EXPO_PUBLIC_SUPPORT_EMAIL \
            EXPO_PUBLIC_PRIVACY_EMAIL \
            EXPO_PUBLIC_SECURITY_EMAIL \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set before deploying the web app."
              missing=1
            fi
          done

          # ☠️ Forwarding the key (the `env:` block above) is only half of #2263:
          # clearing it, renaming it, or setting it on one environment only ships
          # a bundle whose browser reminders are silently dead, exactly as they
          # were from 2026-05-05 to 2026-09-08 - green deploy, nothing red. So it
          # is checked HERE too, where the deployment is expected to have it.
          if [ -z "$EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" ]; then
            if [ "$IS_UPSTREAM" = "true" ]; then
              echo "::error::EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY must be set before deploying the web app - browser reminders are inlined at export time and go dead without it."
              missing=1
            else
              echo "::warning::EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY is unset; this build ships with browser reminders unavailable."
            fi
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Export web app
        run: npm run export:web

      - name: Write version document
        # The update surface's source of truth (#388 spec section 2): the
        # deployed app version plus when it went out. publishedAt gates the
        # native update offer behind a 24h grace window for Play review/CDN.
        run: |
          node -e "const v = require('./package.json').version; require('fs').writeFileSync('dist/version.json', JSON.stringify({ version: v, publishedAt: new Date().toISOString() }))"
          cat dist/version.json

      - name: Mark staging as noindex
        # Staging is public but unlisted (decision #16): a dist-level _headers
        # file APPENDS X-Robots-Tag only on staging deploys - appended, never
        # redirected, so the security headers exported from public/_headers
        # (CSP, HSTS, ...) survive; production is untouched.
        if: ${{ inputs.environment == 'staging' }}
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers

      - name: Strip the sitemap from staging
        # The sitemap names production URLs (scripts/lib/index-list.js writes the
        # apex origin, never the deploying host), so a staging copy would point a
        # crawler at another host's pages. Delete it, and the robots.txt line that
        # advertises it. No path is disallowed: a disallowed URL is never
        # fetched, so the noindex header above would never be read
        # (docs/indexability.md § 6.7). test/index-list.test.ts pins this step.
        if: ${{ inputs.environment == 'staging' }}
        run: |
          rm dist/sitemap.xml
          sed -i '/^Sitemap:/d' dist/robots.txt
          cat dist/robots.txt

      # TRANSITION NOTE (until the prod cutover, control-tower#69): production
      # traffic is still served by Netlify until the owner binds selftend.org
      # to the Worker. A Release in that window updates ONLY the Worker (the
      # intended deploy->verify->bind path); if that release must also reach
      # the live Netlify site, re-publish it there manually. The note dies with
      # the Netlify site at cutover.

      # wrangler 4.x requires Node >= 22; below that, wrangler-action falls
      # back to wrangler 3.90, which uploads _headers as a plain asset instead
      # of applying it -- no CSP/HSTS, and staging loses its X-Robots-Tag
      # (found at control-tower#68 verification). The whole job runs on 22 now,
      # so no per-step Node switch is needed.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin Wrangler 4 explicitly: this repo has no wrangler dependency, so
          # wrangler-action@v3 would otherwise install its packaged default
          # (3.90), which uploads _headers as a plain asset. 4.x applies it (and
          # requires the Node 22 step above).
          wranglerVersion: "4"
          command: deploy --config ${{ inputs.environment == 'staging' && 'wrangler.staging.toml' || 'wrangler.toml' }}
