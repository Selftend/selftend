name: release-please

# Conventional-commit driven versioning. On each push to main, release-please
# opens/updates a release PR that bumps package.json + package-lock.json and writes
# CHANGELOG.md from the commit history. Merging that PR tags the release (vX.Y.Z) and
# publishes a GitHub Release. app.config.ts reads `version` from package.json, so the
# app's versionName follows automatically; EAS remote versioning owns the versionCode.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not a floating tag - the only action in this repo that is
      # (#2676). Every other action here fails LOUDLY if it misbehaves: a broken
      # checkout or wrangler-action reddens its job. This one can SUCCEED while
      # publishing a Release whose authorship silently decides whether three
      # other workflows run at all (release.yml, release-thread.yml,
      # back-merge.yml all fire on `release: published`, and only because the
      # Release is PAT-authored - see Invariant 2 in docs/releasing.md). It is
      # also the only action handed a long-lived write-scoped PAT. A retag of a
      # floating tag could change any of that with no diff in this repository.
      #
      # Bump deliberately, via the Dependabot PR (.github/dependabot.yml), and
      # keep the trailing comment in step with the SHA - Dependabot rewrites
      # both. test/workflow-action-pin.test.ts holds this pin.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PAT, not GITHUB_TOKEN: the org locks Actions from creating PRs, and a PAT
          # also lets the release PR trigger the required `verify` check. Create a
          # fine-grained PAT (Contents + Pull requests: Read/write) as this secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Locate the current pending release PR, three tiers (#64: the label-only
      # query raced GitHub's search index - a PR created seconds earlier wasn't
      # findable by label yet, so the v0.3.2 release PR stranded un-approved):
      #   1. The action's own `pr` output - authoritative on the run that created
      #      or updated the PR (exactly the run that used to lose the race), but
      #      empty on runs that didn't change the release (docs/chore pushes).
      #   2. Head-branch query - the REST pulls API is strongly consistent, no
      #      search-index lag; covers sweeping a stranded PR on later pushes.
      #   3. Label query - last resort, keeps working if the branch naming ever
      #      changes.
      - name: Locate the release PR
        id: rp
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          num=$(printf '%s' "$RELEASE_PR" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$num" ]; then
            # --head matches by branch NAME across forks too - restrict to heads
            # in this repo, or a fork PR named like the release branch could get
            # bot-approved and auto-merged.
            num=$(gh pr list --repo "${{ github.repository }}" --state open \
              --head "release-please--branches--main--components--selftend" \
              --json number,headRepositoryOwner \
              --jq '[.[] | select(.headRepositoryOwner.login == "${{ github.repository_owner }}")][0].number // empty')
          fi
          if [ -z "$num" ]; then
            num=$(gh pr list --repo "${{ github.repository }}" --state open \
              --label "autorelease: pending" --json number --jq '.[0].number // empty')
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "Release PR: ${num:-none}"

      # Satisfy the "require 1 approving review" rule for the RELEASE PR ONLY. It is
      # authored by the PAT (i.e. by you) and GitHub forbids self-approval, so approve as
      # github-actions[bot] via GITHUB_TOKEN - a distinct identity. Contributors' human
      # PRs are untouched and still need a real review. continue-on-error so a transient
      # failure doesn't block arming auto-merge.
      # REQUIRES the org/repo setting "Allow GitHub Actions to create and approve pull requests".
      - name: Approve the release PR (bot)
        if: ${{ steps.rp.outputs.num }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --repo "${{ github.repository }}" --approve "${{ steps.rp.outputs.num }}"

      # Arm GitHub auto-merge (PAT) so it squash-merges the release PR once all
      # requirements (the bot approval above + required checks) are met. Idempotent.
      # Needs "Allow auto-merge" on in repo settings.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.rp.outputs.num }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh pr merge --repo "${{ github.repository }}" --auto --squash "${{ steps.rp.outputs.num }}"
