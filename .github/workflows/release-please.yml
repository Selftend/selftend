name: release-please

# Conventional-commit driven versioning. On each push to main, release-please
# opens/updates a release PR that bumps package.json + package-lock.json and writes
# CHANGELOG.md from the commit history. Merging that PR tags the release (vX.Y.Z) and
# publishes a GitHub Release. app.config.ts reads `version` from package.json, so the
# app's versionName follows automatically; EAS remote versioning owns the versionCode.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # PAT, not GITHUB_TOKEN: the org locks Actions from creating PRs, and a PAT
          # also lets the release PR trigger the required `verify` check. Create a
          # fine-grained PAT (Contents + Pull requests: Read/write) as this secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Locate the current pending release PR by release-please's own label - not the
      # action's per-run `pr` output, which is empty on runs that didn't change the
      # release (e.g. docs/chore-only pushes). This way the approve + auto-merge below
      # fire on every run, so the release PR can't get stranded un-approved.
      - name: Locate the release PR
        id: rp
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          num=$(gh pr list --repo "${{ github.repository }}" --state open \
            --label "autorelease: pending" --json number --jq '.[0].number // empty')
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "Release PR: ${num:-none}"

      # Satisfy the "require 1 approving review" rule for the RELEASE PR ONLY. It is
      # authored by the PAT (i.e. by you) and GitHub forbids self-approval, so approve as
      # github-actions[bot] via GITHUB_TOKEN - a distinct identity. Contributors' human
      # PRs are untouched and still need a real review. continue-on-error so a transient
      # failure doesn't block arming auto-merge.
      # REQUIRES the org/repo setting "Allow GitHub Actions to create and approve pull requests".
      - name: Approve the release PR (bot)
        if: ${{ steps.rp.outputs.num }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --repo "${{ github.repository }}" --approve "${{ steps.rp.outputs.num }}"

      # Arm GitHub auto-merge (PAT) so it squash-merges the release PR once all
      # requirements (the bot approval above + required checks) are met. Idempotent.
      # Needs "Allow auto-merge" on in repo settings.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.rp.outputs.num }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh pr merge --repo "${{ github.repository }}" --auto --squash "${{ steps.rp.outputs.num }}"
