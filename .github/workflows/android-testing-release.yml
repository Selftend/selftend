name: Android Play closed-testing release (dev)

# The dev half of the release topology (#374): build `dev` and release it to
# the closed testing tracks (Groups, mirrored onto alpha), so the recruited
# tester group runs AHEAD of production between releases instead of holding the
# identical bits real users already have.
#
# Manual dispatch, deliberately:
#   - not per-merge: the local EAS build runs ~90 minutes and dev merges many
#     times a day - most runs would cancel each other under the shared
#     concurrency group and the rest would burn build time nobody asked for;
#   - not nightly: an idle day still costs a full build to ship bits nobody is
#     waiting to test.
# Dispatch it when dev holds something worth testers' attention.
#
# versionCode: every build draws from one remote counter (eas.json
# appVersionSource: remote), so a new dev build always outnumbers the newest
# production release and Play immediately serves testers the dev build. Between
# a production release and the next dispatch, the testing tracks hold the
# production versionCode (mirrored by android-release.yml) - the same bits
# users have, never older. Nothing needs to maintain an ordering invariant;
# the shared counter is the invariant.
#
# THE PRECONDITION (why the preflight job exists): testers keep their real
# accounts, so this build ships with the PRODUCTION backend - and dev may carry
# migrations production has not run yet. A dev client that depends on an
# unpromoted migration will misbehave against the production schema, and that
# failure is a false signal (the promotion carries the migration). The
# preflight lists every migration on dev that production lacks; if any of them
# is one this build's client code needs, promote first and dispatch after.
# Rejected alternatives, recorded so they are not re-derived: pointing testing
# builds at the staging backend severs testers from their real accounts and
# data mid-use (one package id = one backend per device), and a second package
# id is a second Play app to operate. Revisit only if the tester group grows
# past hand-coordination or promotions become infrequent.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: List migrations production does not have
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dev with main
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Diff supabase/migrations against main
        run: |
          new_migrations="$(git diff --name-only --diff-filter=A origin/main..HEAD -- supabase/migrations/ || true)"
          if [ -n "$new_migrations" ]; then
            {
              echo "### ⚠️ dev carries migrations production has not run"
              echo
              echo "This testing build ships with the PRODUCTION backend. If the client"
              echo "code in this build depends on any migration below, promote dev to"
              echo "main first and dispatch again after the release."
              echo
              echo '```'
              echo "$new_migrations"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::dev carries migrations production has not run - see the job summary. Continue only if this build's client code does not depend on them."
          else
            echo "No unpromoted migrations - dev's client is schema-compatible with production." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-closed-testing:
    name: Build dev and release to closed testing
    needs: preflight
    uses: ./.github/workflows/android-release.yml
    with:
      ref: dev
      submit_profile: closed
      environment: production
    secrets: inherit
